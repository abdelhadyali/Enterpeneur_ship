\u062f\u062f.`\n        : `Hello! Thank you for accepting my application and scheduling the interview. Looking forward to speaking with you.`,\n      time: '10:15 AM',\n    },\n    {\n      id: '2',\n      sender: 'me',\n      text: isAr\n        ? `\u0623\u0647\u0644\u0627\u064b \u0628\u0643! \u062a\u0645 \u0625\u0631\u0633\u0627\u0644 \u0631\u0627\u0628\u0637 \u0627\u0644\u0644\u0642\u0627\u0621 \u0627\u0644\u0645\u0634\u0641\u0631 \u0648\u0633\u0646\u062a\u0646\u0627\u0642\u0634 \u0641\u064a \u062a\u0641\u0627\u0635\u064a\u0644 \u0627\u0644\u062f\u0648\u0631 \u0627\u0644\u0648\u0638\u064a\u0641\u064a \u0628\u0639\u062f \u0645\u0631\u0627\u062c\u0639\u0629 \u0646\u062a\u064a\u062c\u062a\u0643 \u0627\u0644\u0645\u0645\u062a\u0627\u0632\u0629 \u0641\u064a \u0627\u0644\u0627\u062e\u062a\u0628\u0627\u0631.`\n        : `Welcome! We sent the interview room link and are excited to discuss the role after reviewing your excellent test score.`,\n      time: '10:18 AM',\n    },\n  ]);\n  const [inputText, setInputText] = useState('');\n  const [showOfferForm, setShowOfferForm] = useState(false);\n  const [offerSalary, setOfferSalary] = useState('11,000');\n  const [offerTitle, setOfferTitle] = useState('Junior Accountant');\n\n  if (!isOpen) return null;\n\n  const handleSendMessage = (textToSend?: string) => {\n    const text = textToSend || inputText.trim();\n    if (!text) return;\n    playClickSound();\n\n    const newMsg: Message = {\n      id: Date.now().toString(),\n      sender: 'me',\n      text: text,\n      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),\n    };\n\n    setMessages((prev) => [...prev, newMsg]);\n    setInputText('');\n\n    // Simulate reply after 1.5 seconds\n    setTimeout(() => {\n      playSuccessSound();\n      setMessages((prev) => [\n        ...prev,\n        {\n          id: (Date.now() + 1).toString(),\n          sender: 'other',\n          text: isAr\n            ? '\u062a\u0645\u0627\u0645 \u062c\u062f\u0627\u064b\u060c \u062a\u0645 \u0627\u0633\u062a\u0644\u0627\u0645 \u0631\u0633\u0627\u0644\u062a\u0643\u0645 \u0648\u0634\u0643\u0631\u0627\u064b \u0644\u0627\u0647\u062a\u0645\u0627\u0645\u0643\u0645 \u0648\u0633\u0631\u0639\u0629 \u0627\u0644\u0631\u062f! \ud83d\udc4d'\n            : 'Got it! Thank you so much for the prompt communication and updates! \ud83d\udc4d',\n          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),\n        },\n      ]);\n    }, 1500);\n  };\n\n  const handleSendJobOffer = () => {\n    playSuccessSound();\n    const newMsg: Message = {\n      id: Date.now().toString(),\n      sender: 'me',\n      text: isAr\n        ? `\u064a\u0633\u0639\u062f\u0646\u0627 \u062a\u0642\u062f\u064a\u0645 \u0639\u0631\u0636 \u0639\u0645\u0644 \u0631\u0633\u0645\u064a \u0644\u0634\u063a\u0644 \u0648\u0638\u064a\u0641\u0629 (${offerTitle}) \u0628\u0631\u0627\u062a\u0628 \u0634\u0647\u0631\u064a (${offerSalary} \u062c.\u0645)!`\n        : `We are pleased to extend an official job offer for (${offerTitle}) with a monthly compensation of (${offerSalary} EGP)!`,\n      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),\n      isOffer: true,\n      offerDetails: { title: offerTitle, salary: offerSalary },\n    };\n    setMessages((prev) => [...prev, newMsg]);\n    setShowOfferForm(false);\n  };\n\n  return (\n    <div\n      onClick={(e) => {\n        if (e.target === e.currentTarget) onClose();\n      }}\n      className=\"fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/70 backdrop-blur-2xs animate-fade-in\"\n    >\n      <div className=\"w-full max-w-md bg-[var(--sf)] rounded-t-3xl sm:rounded-3xl border border-[var(--ln)] shadow-2xl flex flex-col h-[82vh] max-h-[640px] overflow-hidden animate-up\">\n        {/* Chat Header */}\n        <div className=\"px-4 py-3 bg-[var(--sf)] border-b border-[var(--ln)] flex items-center justify-between z-10\">\n          <div className=\"flex items-center gap-2.5\">\n            {candidateAvatar}\n            <div>\n              <div className=\"flex items-center gap-1.5\">\n                <h3 className=\"font-extrabold text-sm text-[var(--tx)]\">{candidateName}</h3>\n                <span className=\"w-2 h-2 rounded-full bg-emerald-500 animate-pulse\"></span>\n              </div>\n              <span className=\"text-[10px] text-emerald-700 dark:text-emerald-400 font-bold block\">\n                {isAr ? '\u0645\u062a\u0635\u0644 \u0627\u0644\u0622\u0646 \u2022 \u0641\u062d\u0635 \u0627\u0644\u0645\u0647\u0627\u0631\u0627\u062a \u0645\u0639\u062a\u0645\u062f' : 'Online \u2022 Verified Candidate'}\n              </span>\n            </div>\n          </div>\n          <div className=\"flex items-center gap-1.5\">\n            <button\n              onClick={onClose}\n              className=\"w-8 h-8 rounded-full border border-[var(--ln)] flex items-center justify-center text-[var(--mu)] hover:text-[var(--tx)]\"\n            >\n              <X className=\"w-4 h-4\" />\n            </button>\n          </div>\n        </div>\n\n        {/* Quick Offer Drawer Toggle */}\n        <div className=\"px-4 py-2 bg-[var(--bg)] border-b border-[var(--ln)] flex items-center justify-between text-xs\">\n          <span className=\"text-[11px] font-bold text-[var(--mu)]\">\n            {isAr ? '\u0645\u062d\u0627\u062f\u062b\u0629 \u0645\u0628\u0627\u0634\u0631\u0629 \u0645\u0624\u0645\u0646\u0629' : 'Encrypted In-App Chat'}\n          </span>\n          <button\n            onClick={() => setShowOfferForm(!showOfferForm)}\n            className=\"px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-700 dark:text-amber-300 font-extrabold text-[11px] flex items-center gap-1 transition\"\n          >\n            <Sparkles className=\"w-3 h-3 text-amber-500\" />\n            <span>{isAr ? '\u062a\u0642\u062f\u064a\u0645 \u0639\u0631\u0636 \u0639\u0645\u0644 \u0631\u0633\u0645\u064a' : 'Send Job Offer'}</span>\n          </button>\n        </div>\n\n        {/* Offer Form Drawer */}\n        {showOfferForm && (\n          <div className=\"p-3 bg-amber-50/90 dark:bg-amber-950/40 border-b border-amber-300 dark:border-amber-700/60 space-y-2 animate-up\">\n            <h4 className=\"font-black text-xs text-amber-800 dark:text-amber-300\">\n              {isAr ? '\u062a\u062c\u0647\u064a\u0632 \u0639\u0631\u0636 \u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u0631\u0633\u0645\u064a:' : 'Draft Official Job Offer:'}\n            </h4>\n            <div className=\"flex gap-2\">\n              <input\n                type=\"text\"\n                value={offerTitle}\n                onChange={(e) => setOfferTitle(e.target.value)}\n                placeholder=\"Job Title\"\n                className=\"w-1/2 h-8 px-2 rounded-lg border border-amber-300 text-xs bg-[var(--sf)]\"\n              />\n              <input\n                type=\"text\"\n                value={offerSalary}\n                onChange={(e) => setOfferSalary(e.target.value)}\n                placeholder=\"Salary (EGP)\"\n                className=\"w-1/2 h-8 px-2 rounded-lg border border-amber-300 text-xs bg-[var(--sf)]\"\n              />\n            </div>\n            <div className=\"flex justify-end gap-1.5 pt-1\">\n              <button\n                onClick={() => setShowOfferForm(false)}\n                className=\"px-3 py-1 rounded-lg border border-amber-300 text-[11px] font-bold\"\n              >\n                {isAr ? '\u0625\u0644\u063a\u0627\u0621' : 'Cancel'}\n              </button>\n              <button\n                onClick={handleSendJobOffer}\n                className=\"px-3 py-1 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-black text-[11px] shadow-xs\"\n              >\n                {isAr ? '\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u0639\u0631\u0636 \u0644\u0644\u0645\u0631\u0634\u062d' : 'Send Offer'}\n              </button>\n            </div>\n          </div>\n        )}\n\n        {/* Messages Body */}\n        <div className=\"flex-1 overflow-y-auto p-4 space-y-3 bg-[var(--bg)]\">\n          {messages.map((m) => (\n            <div\n              key={m.id}\n              className={`flex flex-col ${m.sender === 'me' ? 'items-end' : 'items-start'}`}\n            >\n              <div\n                className={`max-w-[82%] p-3 rounded-2xl text-xs leading-relaxed shadow-2xs ${\n                  m.isOffer\n                    ? 'bg-gradient-to-br from-amber-500 to-amber-600 text-white font-bold border-2 border-amber-300 shadow-md'\n                    : m.sender === 'me'\n                    ? 'bg-[var(--pri)] text-white font-medium rounded-ee-none'\n                    : 'bg-[var(--sf)] text-[var(--tx)] font-medium border border-[var(--ln)] rounded-es-none'\n                }`}\n              >\n                {m.isOffer && (\n                  <div className=\"flex items-center gap-1.5 pb-1 mb-1 border-b border-white/30 text-[11px] font-black uppercase\">\n                    <Sparkles className=\"w-3.5 h-3.5\" />\n                    <span>{isAr ? '\u0639\u0631\u0636 \u0639\u0645\u0644 \u0645\u0639\u062a\u0645\u062f \u0631\u0633\u0645\u064a\u0627\u064b' : 'OFFICIAL JOB OFFER'}</span>\n                  </div>\n                )}\n                <p>{m.text}</p>\n                <div\n                  className={`flex items-center justify-end gap-1 mt-1 text-[9px] ${\n                    m.sender === 'me' ? 'text-white/80' : 'text-[var(--mu)]'\n                  }`}\n                >\n                  <span>{m.time}</span>\n                  {m.sender === 'me' && <CheckCheck className=\"w-3 h-3\" />}\n                </div>\n              </div>\n            </div>\n          ))}\n        </div>\n\n        {/* Quick Suggestion Chips */}\n        <div className=\"px-3 py-1.5 bg-[var(--sf)] border-t border-[var(--ln)] flex items-center gap-1.5 overflow-x-auto text-[11px] no-scrollbar\">\n          {[\n            isAr ? '\u062a\u0623\u0643\u064a\u062f \u0627\u0644\u062d\u0636\u0648\u0631 \u0644\u0644\u0645\u0642\u0627\u0628\u0644\u0629' : 'Confirm interview time',\n            isAr ? '\u0625\u0631\u0633\u0627\u0644 \u0643\u0648\u062f \u063a\u0631\u0641\u0629 \u0627\u0644\u0627\u062c\u062a\u0645\u0627\u0639' : 'Send meeting room pin',\n            isAr ? '\u0637\u0644\u0628 \u062a\u0641\u0627\u0635\u064a\u0644 \u0625\u0636\u0627\u0641\u064a\u0629' : 'Request more details',\n          ].map((chip, idx) => (\n            <button\n              key={idx}\n              onClick={() => handleSendMessage(chip)}\n              className=\"px-2.5 py-1 rounded-full bg-[var(--bg)] hover:bg-[var(--okb)] border border-[var(--ln)] text-[var(--mu)] hover:text-[var(--pri)] whitespace-nowrap font-bold transition active:scale-95\"\n            >\n              {chip}\n            </button>\n          ))}\n        </div>\n\n        {/* Chat Input Bar */}\n        <div className=\"p-3 bg-[var(--sf)] border-t border-[var(--ln)] flex items-center gap-2\">\n          <input\n            type=\"text\"\n            value={inputText}\n            onChange={(e) => setInputText(e.target.value)}\n            onKeyDown={(e) => {\n              if (e.key === 'Enter') handleSendMessage();\n            }}\n            placeholder={isAr ? '\u0627\u0643\u062a\u0628 \u0631\u0633\u0627\u0644\u062a\u0643 \u0644\u0644\u0645\u0631\u0634\u062d...' : 'Type message...'}\n            className=\"flex-1 h-11 px-3.5 rounded-xl border border-[var(--ln)] bg-[var(--bg)] text-xs font-semibold focus:border-[var(--pri)] outline-none\"\n          />\n          <button\n            onClick={() => handleSendMessage()}\n            disabled={!inputText.trim()}\n            className=\"w-11 h-11 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] disabled:bg-[var(--ln)] disabled:text-[var(--mu)] text-white flex items-center justify-center shadow-xs transition active:scale-95\"\n          >\n            <Send className=\"w-4 h-4\" />\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n\n\n// ===== src/ExcelSandbox.tsx =====\n\n\n\n\ninterface ExcelSandboxProps {\n  onSuccess: () => void;\n  langIndex: number;\n}\n\nconst ExcelSandbox: React.FC<ExcelSandboxProps> = ({ onSuccess, langIndex }) => {\n  const isAr = langIndex === 1;\n  const [formulaInput, setFormulaInput] = useState('');\n  const [result, setResult] = useState<number | string>('...');\n  const [isCorrect, setIsCorrect] = useState<boolean | null>(null);\n\n  // Sample data: Sales Q1-Q4\n  const gridData = [\n    { row: 1, item: isAr ? '\u0627\u0644\u0631\u0628\u0639 \u0627\u0644\u0623\u0648\u0644 (Q1)' : 'Quarter 1', value: 2500 },\n    { row: 2, item: isAr ? '\u0627\u0644\u0631\u0628\u0639 \u0627\u0644\u062b\u0627\u0646\u064a (Q2)' : 'Quarter 2', value: 3200 },\n    { row: 3, item: isAr ? '\u0627\u0644\u0631\u0628\u0639 \u0627\u0644\u062b\u0627\u0644\u062b (Q3)' : 'Quarter 3', value: 4100 },\n    { row: 4, item: isAr ? '\u0627\u0644\u0631\u0628\u0639 \u0627\u0644\u0631\u0627\u0628\u0639 (Q4)' : 'Quarter 4', value: 5200 },\n  ];\n\n  const totalSum = gridData.reduce((acc, row) => acc + row.value, 0); // 15000\n\n  const handleEvaluate = () => {\n    playClickSound();\n    const clean = formulaInput.trim().toUpperCase().replace(/\\s+/g, '');\n\n    // Allow multiple correct formula variants: =SUM(B1:B4), SUM(B1:B4), =SUM(B1,B2,B3,B4), =B1+B2+B3+B4\n    if (\n      clean === '=SUM(B1:B4)' ||\n      clean === 'SUM(B1:B4)' ||\n      clean === '=SUM(B1,B2,B3,B4)' ||\n      clean === '=B1+B2+B3+B4'\n    ) {\n      setResult(totalSum);\n      setIsCorrect(true);\n      playSuccessSound();\n      onSuccess();\n    } else if (clean.startsWith('=AVERAGE') || clean.startsWith('AVERAGE')) {\n      setResult(totalSum / 4);\n      setIsCorrect(false);\n      playWarningSound();\n    } else {\n      setResult('#VALUE!');\n      setIsCorrect(false);\n      playWarningSound();\n    }\n  };\n\n  return (\n    <div className=\"p-4 rounded-3xl border-2 border-emerald-400 dark:border-emerald-600/60 bg-[var(--sf)] space-y-3 shadow-md animate-pop\">\n      {/* Header */}\n      <div className=\"flex items-center justify-between\">\n        <div className=\"flex items-center gap-1.5 text-xs font-black text-emerald-800 dark:text-emerald-300\">\n          <Table className=\"w-4 h-4 text-emerald-600\" />\n          <span>{isAr ? '\u0645\u062d\u0627\u0643\u0627\u0629 \u0639\u0645\u0644\u064a\u0629 \u062d\u064a\u0629 (Excel Sandbox)' : 'Live Interactive Excel Sandbox'}</span>\n        </div>\n        <span className=\"px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-black\">\n          {isAr ? '\u062a\u0637\u0628\u064a\u0642 \u062a\u0641\u0627\u0639\u0644\u064a \u0645\u0628\u0627\u0634\u0631' : 'Interactive'}\n        </span>\n      </div>\n\n      <p className=\"text-xs text-[var(--tx)] font-extrabold leading-relaxed\">\n        {isAr\n          ? '\u0627\u0644\u0645\u0637\u0644\u0648\u0628: \u0627\u0643\u062a\u0628 \u0645\u0639\u0627\u062f\u0644\u0629 Excel \u0627\u0644\u0635\u062d\u064a\u062d\u0629 \u0644\u062d\u0633\u0627\u0628 \u0625\u062c\u0645\u0627\u0644\u064a \u0627\u0644\u0645\u0628\u064a\u0639\u0627\u062a \u0644\u0644\u062e\u0644\u064a\u0629 (B5):'\n          : 'Task: Write the correct Excel formula to calculate the Total Sales for cell (B5):'}\n      </p>\n\n      {/* Mini Spreadsheet Table */}\n      <div className=\"rounded-xl border border-[var(--ln)] overflow-hidden text-xs font-mono\">\n        <div className=\"grid grid-cols-12 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold border-b border-[var(--ln)] py-1 text-center\">\n          <span className=\"col-span-2 text-[10px]\">#</span>\n          <span className=\"col-span-6 text-[11px]\">A ({isAr ? '\u0627\u0644\u0628\u0646\u062f' : 'Item'})</span>\n          <span className=\"col-span-4 text-[11px]\">B ({isAr ? '\u0627\u0644\u0645\u0628\u064a\u0639\u0627\u062a' : 'Sales'})</span>\n        </div>\n\n        {gridData.map((row) => (\n          <div\n            key={row.row}\n            className=\"grid grid-cols-12 py-1.5 px-1 border-b border-[var(--ln)]/60 text-center bg-[var(--sf)]\"\n          >\n            <span className=\"col-span-2 text-[var(--mu)] font-bold\">{row.row}</span>\n            <span className=\"col-span-6 font-sans text-start ps-2 truncate font-semibold text-[11px]\">\n              {row.item}\n            </span>\n            <span className=\"col-span-4 font-black text-emerald-700 dark:text-emerald-300\">\n              {row.value.toLocaleString()}\n            </span>\n          </div>\n        ))}\n\n        {/* Target Result Row 5 */}\n        <div className=\"grid grid-cols-12 py-1.5 px-1 bg-emerald-50/80 dark:bg-emerald-950/40 text-center font-bold items-center\">\n          <span className=\"col-span-2 text-emerald-700 dark:text-emerald-400\">5</span>\n          <span className=\"col-span-6 font-sans text-start ps-2 font-black text-xs\">\n            {isAr ? '\u0627\u0644\u0625\u062c\u0645\u0627\u0644\u064a (Total)' : 'Total'}\n          </span>\n          <span className=\"col-span-4 font-black text-sm text-[var(--pri)]\">\n            {result}\n          </span>\n        </div>\n      </div>\n\n      {/* Formula Input Bar (fx) */}\n      <div className=\"flex items-center gap-2 pt-1\">\n        <span className=\"font-mono font-black text-xs text-[var(--mu)] italic px-1\">fx</span>\n        <input\n          type=\"text\"\n          value={formulaInput}\n          onChange={(e) => setFormulaInput(e.target.value)}\n          onKeyDown={(e) => {\n            if (e.key === 'Enter') handleEvaluate();\n          }}\n          placeholder=\"=SUM(B1:B4)\"\n          className=\"flex-1 h-11 px-3 rounded-xl border-2 border-emerald-400 dark:border-emerald-600 bg-[var(--bg)] font-mono text-xs font-bold outline-none text-[var(--tx)]\"\n        />\n        <button\n          onClick={handleEvaluate}\n          className=\"px-4 h-11 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white text-xs font-extrabold shadow-sm transition active:scale-95 flex items-center gap-1\"\n        >\n          <span>{isAr ? '\u062a\u0637\u0628\u064a\u0642 \u0627\u0644\u062f\u0627\u0644\u0629' : 'Execute'}</span>\n        </button>\n      </div>\n\n      {/* Evaluation Feedback */}\n      {isCorrect === true && (\n        <div className=\"p-2.5 rounded-xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300 text-xs font-black flex items-center gap-2 animate-bounce\">\n          <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n          <span>\n            {isAr\n              ? '\u0635\u062d\u064a\u062d \u062a\u0645\u0627\u0645\u0627\u064b! \u062a\u0645 \u062d\u0633\u0627\u0628 \u0627\u0644\u0645\u062c\u0645\u0648\u0639 (15,000) \u0648\u0627\u0639\u062a\u0645\u0627\u062f \u0625\u062c\u0627\u0628\u062a\u0643 \u0627\u0644\u0639\u0645\u0644\u064a\u0629.'\n              : 'Spot on! The formula evaluated to 15,000 and your practical skill is verified.'}\n          </span>\n        </div>\n      )}\n\n      {isCorrect === false && (\n        <div className=\"p-2.5 rounded-xl bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 text-xs font-bold flex items-center gap-2\">\n          <AlertCircle className=\"w-4 h-4 text-amber-600\" />\n          <span>\n            {isAr\n              ? '\u0635\u064a\u063a\u0629 \u0627\u0644\u0645\u0639\u0627\u062f\u0644\u0629 \u063a\u064a\u0631 \u062f\u0642\u064a\u0642\u0629. \u062d\u0627\u0648\u0644 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u062f\u0627\u0644\u0629 \u0627\u0644\u062c\u0645\u0639: =SUM(B1:B4)'\n              : 'Formula mismatch. Try using the sum range formula: =SUM(B1:B4)'}\n          </span>\n        </div>\n      )}\n    </div>\n  );\n};\n\n\n// ===== src/VideoRoomModal.tsx =====\n\n\n\n\ninterface VideoRoomModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  candidateName: string;\n  slotText: string;\n  badgeId: string;\n  langIndex: number;\n}\n\nconst VideoRoomModal: React.FC<VideoRoomModalProps> = ({\n  isOpen,\n  onClose,\n  candidateName,\n  slotText,\n  badgeId,\n  langIndex,\n}) => {\n  const isAr = langIndex === 1;\n  const [isCameraOn, setIsCameraOn] = useState(true);\n  const [isMicOn, setIsMicOn] = useState(true);\n  const [activeTab, setActiveTab] = useState<'room' | 'tips'>('room');\n\n  if (!isOpen) return null;\n\n  return (\n    <div\n      onClick={(e) => {\n        if (e.target === e.currentTarget) onClose();\n      }}\n      className=\"fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-2xs animate-fade-in\"\n    >\n      <div className=\"w-full max-w-md bg-slate-950 text-white rounded-3xl border border-slate-800 shadow-2xl flex flex-col h-[85vh] max-h-[660px] overflow-hidden animate-up\">\n        {/* Top Header */}\n        <div className=\"px-4 py-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between z-10\">\n          <div className=\"flex items-center gap-2\">\n            <span className=\"w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping\"></span>\n            <div>\n              <h3 className=\"font-black text-sm text-white flex items-center gap-1.5\">\n                <span>{isAr ? '\u063a\u0631\u0641\u0629 \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0627\u0644\u0645\u0628\u0627\u0634\u0631\u0629' : 'Live Interview Room'}</span>\n                <span className=\"text-[10px] font-mono text-emerald-400 font-bold px-1.5 py-0.2 rounded bg-emerald-950/80 border border-emerald-800\">\n                  {badgeId}\n                </span>\n              </h3>\n              <p className=\"text-[10px] text-slate-400 font-semibold\">{slotText}</p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300\"\n          >\n            <X className=\"w-4 h-4\" />\n          </button>\n        </div>\n\n        {/* View Switcher: Room vs Interview Tips */}\n        <div className=\"flex border-b border-slate-800 text-xs font-bold bg-slate-900/60\">\n          <button\n            onClick={() => setActiveTab('room')}\n            className={`flex-1 py-2 text-center transition ${\n              activeTab === 'room'\n                ? 'text-emerald-400 border-b-2 border-emerald-400 bg-slate-800/40'\n                : 'text-slate-400 hover:text-white'\n            }`}\n          >\n            {isAr ? '\u0634\u0627\u0634\u0629 \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0627\u0644\u062a\u0641\u0627\u0639\u0644\u064a\u0629' : 'Video Screen'}\n          </button>\n          <button\n            onClick={() => setActiveTab('tips')}\n            className={`flex-1 py-2 text-center transition ${\n              activeTab === 'tips'\n                ? 'text-emerald-400 border-b-2 border-emerald-400 bg-slate-800/40'\n                : 'text-slate-400 hover:text-white'\n            }`}\n          >\n            {isAr ? '\u0625\u0631\u0634\u0627\u062f\u0627\u062a \u0648\u0623\u0633\u0626\u0644\u0629 \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629' : 'Interview Guide'}\n          </button>\n        </div>\n\n        {activeTab === 'room' ? (\n          <div className=\"flex-1 flex flex-col p-4 justify-between bg-gradient-to-b from-slate-900 via-slate-950 to-black\">\n            {/* Main Stage Video Screen */}\n            <div className=\"w-full flex-1 rounded-2xl bg-slate-900 border border-slate-800 relative flex flex-col items-center justify-center overflow-hidden shadow-inner\">\n              {isCameraOn ? (\n                <div className=\"w-full h-full flex flex-col items-center justify-center relative\">\n                  {/* Simulated Participant feed */}\n                  <div className=\"w-24 h-24 rounded-full bg-gradient-to-br from-emerald-600 to-teal-800 border-4 border-emerald-400 flex items-center justify-center text-white shadow-xl animate-pulse\">\n                    <User className=\"w-12 h-12\" />\n                  </div>\n                  <span className=\"text-xs font-black text-white mt-3 bg-black/60 px-3 py-1 rounded-full border border-slate-700\">\n                    {candidateName}\n                  </span>\n                  <div className=\"absolute top-3 end-3 flex items-center gap-1.5 px-2 py-1 rounded-md bg-black/70 text-[10px] text-emerald-400 font-bold border border-emerald-800\">\n                    <span className=\"w-1.5 h-1.5 rounded-full bg-emerald-400\"></span>\n                    <span>1080p HD</span>\n                  </div>\n                </div>\n              ) : (\n                <div className=\"text-center space-y-2\">\n                  <div className=\"w-16 h-16 rounded-full bg-slate-800 text-slate-500 mx-auto flex items-center justify-center\">\n                    <VideoOff className=\"w-8 h-8\" />\n                  </div>\n                  <p className=\"text-xs text-slate-400 font-bold\">\n                    {isAr ? '\u0627\u0644\u0643\u0627\u0645\u064a\u0631\u0627 \u0645\u063a\u0644\u0642\u0629 \u0645\u0624\u0642\u062a\u0627\u064b' : 'Camera is turned off'}\n                  </p>\n                </div>\n              )}\n\n              {/* Encrypted indicator pill */}\n              <div className=\"absolute bottom-3 start-3 flex items-center gap-1 px-2.5 py-1 rounded-full bg-black/70 text-[10px] text-slate-300 font-bold border border-slate-800\">\n                <ShieldCheck className=\"w-3.5 h-3.5 text-emerald-400\" />\n                <span>{isAr ? '\u0645\u0634\u0641\u0631 \u0645\u0646 \u0637\u0631\u0641 \u0644\u0637\u0631\u0641' : 'End-to-End Encrypted'}</span>\n              </div>\n            </div>\n\n            {/* In-App Meeting Controls Bar */}\n            <div className=\"pt-4 flex items-center justify-center gap-3\">\n              <button\n                onClick={() => {\n                  playClickSound();\n                  setIsCameraOn(!isCameraOn);\n                }}\n                className={`w-12 h-12 rounded-2xl flex items-center justify-center transition ${\n                  isCameraOn\n                    ? 'bg-slate-800 hover:bg-slate-700 text-white'\n                    : 'bg-red-600/90 text-white'\n                }`}\n                title=\"Toggle Camera\"\n              >\n                {isCameraOn ? <Video className=\"w-5 h-5\" /> : <VideoOff className=\"w-5 h-5\" />}\n              </button>\n\n              <button\n                onClick={() => {\n                  playClickSound();\n                  setIsMicOn(!isMicOn);\n                }}\n                className={`w-12 h-12 rounded-2xl flex items-center justify-center transition ${\n                  isMicOn\n                    ? 'bg-slate-800 hover:bg-slate-700 text-white'\n                    : 'bg-red-600/90 text-white'\n                }`}\n                title=\"Toggle Microphone\"\n              >\n                {isMicOn ? <Mic className=\"w-5 h-5\" /> : <MicOff className=\"w-5 h-5\" />}\n              </button>\n\n              <a\n                href={`https://meet.google.com/new`}\n                target=\"_blank\"\n                rel=\"noreferrer\"\n                className=\"px-4 h-12 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs flex items-center gap-1.5 shadow-md transition\"\n              >\n                <ExternalLink className=\"w-4 h-4\" />\n                <span>{isAr ? '\u0641\u062a\u062d \u0641\u064a Google Meet' : 'Open in Google Meet'}</span>\n              </a>\n\n              <button\n                onClick={() => {\n                  playWarningSound();\n                  onClose();\n                }}\n                className=\"w-12 h-12 rounded-2xl bg-red-600 hover:bg-red-700 text-white flex items-center justify-center shadow-md transition\"\n                title=\"End Call\"\n              >\n                <PhoneOff className=\"w-5 h-5\" />\n              </button>\n            </div>\n          </div>\n        ) : (\n          /* Interview Guide & Preparation Tab */\n          <div className=\"flex-1 overflow-y-auto p-4 space-y-3 bg-slate-900 text-slate-200\">\n            <h4 className=\"font-extrabold text-sm text-emerald-400\">\n              {isAr ? '\u0625\u0631\u0634\u0627\u062f\u0627\u062a \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u0639\u0644\u0649 \u0627\u0644\u0643\u0641\u0627\u0621\u0629 \u0648\u0627\u0644\u0645\u0647\u0627\u0631\u0629:' : 'Competency-Based Interview Guide:'}\n            </h4>\n\n            <div className=\"space-y-2.5 text-xs leading-relaxed\">\n              <div className=\"p-3 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-1\">\n                <b className=\"text-white block\">1. {isAr ? '\u0633\u0624\u0627\u0644 \u0627\u0644\u062a\u062d\u0642\u0642 \u0627\u0644\u0639\u0645\u0644\u064a' : 'Practical Verification Question'}</b>\n                <p className=\"text-slate-400\">\n                  {isAr\n                    ? '\u0627\u0637\u0644\u0628 \u0645\u0646 \u0627\u0644\u0645\u0631\u0634\u062d \u0645\u0634\u0627\u0631\u0643\u0629 \u0634\u0627\u0634\u062a\u0647 \u0648\u0641\u062a\u062d \u0645\u0644\u0641 Excel \u0644\u062a\u0637\u0628\u064a\u0642 \u062f\u0627\u0644\u0629 VLOOKUP \u0623\u0648 PivotTable \u0627\u0644\u062a\u064a \u062a\u0645 \u0627\u0644\u062a\u062d\u0642\u0642 \u0645\u0646\u0647\u0627 \u0628\u0627\u062e\u062a\u0628\u0627\u0631\u0647.'\n                    : 'Ask candidate to share screen and demonstrate a real lookup formula or pivot table live.'}\n                </p>\n              </div>\n\n              <div className=\"p-3 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-1\">\n                <b className=\"text-white block\">2. {isAr ? '\u0633\u0624\u0627\u0644 \u0645\u0648\u0627\u0642\u0641 \u0627\u0644\u0639\u0645\u0644 \u0648\u062d\u0644 \u0627\u0644\u0645\u0634\u0643\u0644\u0627\u062a' : 'Scenario-Based Solving'}</b>\n                <p className=\"text-slate-400\">\n                  {isAr\n                    ? '\u0643\u064a\u0641 \u062a\u062a\u0635\u0631\u0641 \u0639\u0646\u062f\u0645\u0627 \u062a\u0643\u062a\u0634\u0641 \u0639\u062f\u0645 \u062a\u0648\u0627\u0632\u0646 \u0641\u064a \u0645\u064a\u0632\u0627\u0646 \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u0623\u0648 \u062e\u0637\u0623 \u0641\u064a \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0645\u0628\u064a\u0639\u0627\u062a\u061f'\n                    : 'How do you handle variance reconciliation or data entry mismatch under deadlines?'}\n                </p>\n              </div>\n\n              <div className=\"p-3 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-1\">\n                <b className=\"text-white block\">3. {isAr ? '\u0627\u0644\u0627\u0644\u062a\u0632\u0627\u0645 \u0628\u0645\u0639\u0627\u064a\u064a\u0631 HIRE ME \u0627\u0644\u0639\u0627\u062f\u0644\u0629' : 'Fair Evaluation SLA'}</b>\n                <p className=\"text-slate-400\">\n                  {isAr\n                    ? '\u062a\u0636\u0645\u0646 \u0627\u0644\u0645\u0646\u0635\u0629 \u0625\u0631\u0633\u0627\u0644 \u0646\u062a\u064a\u062c\u0629 \u0645\u062d\u062f\u062f\u0629 \u0644\u0644\u0645\u0631\u0634\u062d \u062e\u0644\u0627\u0644 \u0645\u0647\u0644\u0629 \u0627\u0644\u0631\u062f \u0627\u0644\u0645\u0633\u062c\u0644\u0629 (3 \u0625\u0644\u0649 5 \u0623\u064a\u0627\u0645) \u0645\u0639 \u0630\u0643\u0631 \u0633\u0628\u0628 \u0627\u0644\u062a\u0648\u062c\u064a\u0647.'\n                    : 'Commit to providing timely constructive feedback within the stated reply commitment (3-5 days).'}\n                </p>\n              </div>\n            </div>\n          </div>\n        )}\n      </div>\n    </div>\n  );\n};\n\n\n// ===== src/components/InterviewSimulator.tsx =====\n\n\nconst INTERVIEW_QUESTIONS = [\n  \"How do you use VLOOKUP or XLOOKUP to merge data from two different tables?\",\n  \"Explain the difference between a Pivot Table and a SUMIF function.\",\n  \"What steps do you take to clean a dataset with missing values and duplicates?\",\n  \"How can you protect a specific range of cells while keeping others editable?\",\n  \"Describe a situation where you had to automate a repetitive task using Excel macros or Power Query.\"\n];\n\nconst InterviewSimulator: React.FC<{ langIndex: number }> = ({ langIndex }) => {\n  const [currentQ, setCurrentQ] = useState(0);\n  const [showResult, setShowResult] = useState(false);\n\n  // Text-to-Speech: Read question aloud\n  useEffect(() => {\n    if (!showResult && 'speechSynthesis' in window) {\n      const utterance = new SpeechSynthesisUtterance(INTERVIEW_QUESTIONS[currentQ]);\n      utterance.lang = langIndex === 1 ? 'ar-EG' : 'en-US';\n      window.speechSynthesis.cancel();\n      window.speechSynthesis.speak(utterance);\n    }\n  }, [currentQ, showResult, langIndex]);\n\n  const nextQuestion = () => {\n    if (currentQ < INTERVIEW_QUESTIONS.length - 1) {\n      setCurrentQ(currentQ + 1);\n    } else {\n      setShowResult(true);\n      window.speechSynthesis.cancel();\n    }\n  };\n\n  return (\n    <div className=\"p-6 rounded-3xl bg-[var(--sf)] border border-[var(--pri)] shadow-lg animate-in fade-in zoom-in duration-500\">\n      {!showResult ? (\n        <div className=\"space-y-6\">\n          <div className=\"flex items-center gap-3\">\n             <div className=\"w-12 h-12 rounded-full bg-emerald-500 animate-pulse flex items-center justify-center\">\n                <span className=\"text-white font-black text-2xl\">\ud83e\udd16</span>\n             </div>\n             <h2 className=\"text-lg font-black text-[var(--tx)]\">\n              {langIndex === 1 ? '\u0627\u0644\u0645\u062d\u0627\u0643\u064a \u0627\u0644\u0635\u0648\u062a\u064a' : 'AI Voice Interviewer'}\n            </h2>\n          </div>\n          <div className=\"p-4 rounded-2xl bg-[var(--okb)] text-[var(--pri)] font-bold text-sm\">\n            Question {currentQ + 1} / {INTERVIEW_QUESTIONS.length}:\n            <p className=\"mt-2 text-[var(--tx)]\">{INTERVIEW_QUESTIONS[currentQ]}</p>\n          </div>\n          <textarea \n            className=\"w-full p-4 rounded-2xl border border-[var(--ln)] bg-[var(--bg)] text-xs text-[var(--tx)] focus:border-[var(--pri)] outline-none\"\n            placeholder={langIndex === 1 ? '\u0627\u0643\u062a\u0628 \u0625\u062c\u0627\u0628\u062a\u0643 \u0647\u0646\u0627...' : 'Type your answer here...'}\n            rows={4}\n          />\n          <button \n            onClick={nextQuestion}\n            className=\"w-full py-3 rounded-xl bg-[var(--pri)] text-white font-black text-sm\"\n          >\n            {langIndex === 1 ? '\u0627\u0644\u062a\u0627\u0644\u064a' : 'Next'}\n          </button>\n        </div>\n      ) : (\n        <div className=\"text-center space-y-4\">\n          <h2 className=\"text-xl font-black text-[var(--ok)]\">\n            {langIndex === 1 ? '\u062a\u0645 \u0627\u0644\u062a\u062f\u0631\u064a\u0628 \u0628\u0646\u062c\u0627\u062d!' : 'Training Completed!'}\n          </h2>\n          <p className=\"text-xs text-[var(--mu)]\">\n            {langIndex === 1 ? '\u0644\u0642\u062f \u0627\u0646\u062a\u0647\u064a\u062a \u0645\u0646 \u0645\u062d\u0627\u0643\u064a \u0627\u0644\u062a\u062f\u0631\u064a\u0628. \u0627\u0633\u062a\u0639\u062f \u0644\u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0627\u0644\u0641\u0639\u0644\u064a\u0629!' : 'You have finished the training simulator. Good luck with the real interview!'}\n          </p>\n        </div>\n      )}\n    </div>\n  );\n};\n\n\n// ===== src/hooks/usePWAInstall.ts =====\n\n\ninterface BeforeInstallPromptEvent extends Event {\n  prompt: () => Promise<void>;\n  userChoice: Promise<{ outcome: 'accepted' | 'dismissed'; platform: string }>;\n}\n\nfunction usePWAInstall2() {\n  const [deferredPrompt, setDeferredPrompt] = useState<BeforeInstallPromptEvent | null>(null);\n  const [isInstalled, setIsInstalled] = useState(false);\n  const [isIOS, setIsIOS] = useState(false);\n\n  useEffect(() => {\n    // Detect standalone mode (already installed)\n    const isStandalone =\n      window.matchMedia('(display-mode: standalone)').matches ||\n      (window.navigator as unknown as { standalone?: boolean }).standalone === true;\n    setIsInstalled(isStandalone);\n\n    // Detect iOS devices\n    const userAgent = window.navigator.userAgent.toLowerCase();\n    const isIOSDevice = /iphone|ipad|ipod/.test(userAgent);\n    setIsIOS(isIOSDevice);\n\n    const handleBeforeInstallPrompt = (e: Event) => {\n      e.preventDefault();\n      setDeferredPrompt(e as BeforeInstallPromptEvent);\n    };\n\n    const handleAppInstalled = () => {\n      setIsInstalled(true);\n      setDeferredPrompt(null);\n    };\n\n    window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);\n    window.addEventListener('appinstalled', handleAppInstalled);\n\n    return () => {\n      window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);\n      window.removeEventListener('appinstalled', handleAppInstalled);\n    };\n  }, []);\n\n  const install = async () => {\n    if (!deferredPrompt) return false;\n    await deferredPrompt.prompt();\n    const { outcome } = await deferredPrompt.userChoice;\n    if (outcome === 'accepted') {\n      setIsInstalled(true);\n      setDeferredPrompt(null);\n      return true;\n    }\n    return false;\n  };\n\n  return {\n    isInstallable: !!deferredPrompt,\n    isInstalled,\n    isIOS,\n    install,\n  };\n}\n\n\n// ===== src/components/PWAInstallButton.tsx =====\n\n\n\n\nconst PWAInstallButton: React.FC = () => {\n  const { isInstallable, isInstalled, isIOS, install } = usePWAInstall2();\n  const [showIOSGuide, setShowIOSGuide] = useState(false);\n\n  // If already running as an installed PWA, hide the button\n  if (isInstalled) {\n    return null;\n  }\n\n  // Chromium / Android / Desktop flow\n  if (isInstallable) {\n    return (\n      <button\n        onClick={install}\n        className=\"flex items-center gap-2 rounded-xl bg-[var(--pri)] px-4 py-2.5 text-xs font-black text-white shadow-md hover:bg-[var(--pri-hover)] transition active:scale-98\"\n      >\n        <Download className=\"w-4 h-4\" />\n        Install App\n      </button>\n    );\n  }\n\n  // iOS Safari flow (beforeinstallprompt is not supported by WebKit)\n  if (isIOS) {\n    return (\n      <>\n        <button\n          onClick={() => setShowIOSGuide(true)}\n          className=\"flex items-center gap-2 rounded-xl border border-[var(--ln)] px-4 py-2.5 text-xs font-black text-[var(--pri)] hover:bg-[var(--okb)] transition active:scale-98\"\n        >\n          <Download className=\"w-4 h-4\" />\n          Install on iOS\n        </button>\n\n        {showIOSGuide && (\n          <div className=\"fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 animate-in fade-in duration-200\">\n            <div className=\"w-full max-w-sm rounded-2xl bg-[var(--sf)] p-6 shadow-xl border border-[var(--ln)]\">\n              <h3 className=\"text-lg font-black text-[var(--tx)]\">Install on iPhone / iPad</h3>\n              <p className=\"mt-2 text-sm text-[var(--mu)] leading-relaxed\">\n                1. Tap the <strong>Share</strong> button in Safari toolbar.<br />\n                2. Scroll down and tap <strong>Add to Home Screen</strong>.\n              </p>\n              <button\n                onClick={() => setShowIOSGuide(false)}\n                className=\"mt-4 w-full rounded-xl bg-[var(--pri)] py-3 text-sm font-black text-white hover:bg-[var(--pri-hover)] transition\"\n              >\n                Close\n              </button>\n            </div>\n          </div>\n        )}\n      </>\n    );\n  }\n\n  return null;\n};\n\n\n// ===== src/App.tsx =====\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\ninterface ApplicationRecord {\n  j: number; // job index\n  st: number; // 0: Sent, 1: Seen, 2: Review, 3: Interview, 4: Result\n  fb: boolean; // feedback given\n}\n\n// Helper to determine initial dark mode based on user system preference and saved settings\nconst getInitialDarkMode = (): boolean => {\n  try {\n    const saved = localStorage.getItem('hireme_theme');\n    if (saved === 'dark') return true;\n    if (saved === 'light') return false;\n    // Follow OS system preference by default\n    if (typeof window !== 'undefined' && window.matchMedia) {\n      return window.matchMedia('(prefers-color-scheme: dark)').matches;\n    }\n  } catch {\n    // Fallback if local storage or matchMedia is not available\n  }\n  return false;\n};\n\nfunction App() {\n  // Locale & Theme state\n  const [langIndex, setLangIndex] = useState<number>(0); // 0 = English (default), 1 = Arabic\n  const [darkMode, setDarkMode] = useState<boolean>(getInitialDarkMode);\n  const [phoneFrame, setPhoneFrame] = useState<boolean>(true);\n\n  // App routing and role state\n  const [scr, setScr] = useState<string>('role'); // 'role', 'login', 'cv', 'detect', 'rules', 'test', 'result', 'jobs', 'job', 'apps', 'app', 'fb', 'onb', 'post', 'posted', 'talent', 'match', 'booked', 'thanks', 'cancelled', 'blocked'\n  const [role, setRole] = useState<'c' | 'k' | null>(null); // 'c' = candidate, 'k' = company\n\n  // User credentials & validation\n  const [username, setUsername] = useState<string>('');\n  const [password, setPassword] = useState<string>('');\n  const [showPassword, setShowPassword] = useState<boolean>(false);\n  const [authError, setAuthError] = useState<{ u?: string; p?: string }>({});\n\n  // CV & Detection\n  const [cvName, setCvName] = useState<string>('');\n  const [cvError, setCvError] = useState<string>('');\n  const [isReadingCV, setIsReadingCV] = useState<boolean>(false);\n\n  // Test / Exam state\n  const [examAgreed, setExamAgreed] = useState<boolean>(false);\n  const [currentQ, setCurrentQ] = useState<number>(0);\n  const [answers, setAnswers] = useState<number[]>([]);\n  const [timeLeft, setTimeLeft] = useState<number>(60);\n  const [toastMessage, setToastMessage] = useState<string>('');\n  const [strikes, setStrikes] = useState<number>(0);\n  const [violationKey, setViolationKey] = useState<string>('');\n  const [retestTime, setRetestTime] = useState<number | null>(null);\n  const [skipRetest, setSkipRetest] = useState<boolean>(false);\n\n  // Candidate Application state\n  const [selectedJobIndex, setSelectedJobIndex] = useState<number>(0);\n  const [applications, setApplications] = useState<ApplicationRecord[]>([]);\n  const [currentAppIndex, setCurrentAppIndex] = useState<number>(0);\n  const [showApplyModal, setShowApplyModal] = useState<boolean>(false);\n  const [salaryFilter, setSalaryFilter] = useState<'all' | 'above' | 'top'>('all');\n  const [jobSearchQuery, setJobSearchQuery] = useState<string>('');\n  const [filterLocation, setFilterLocation] = useState<'all' | 'cairo' | 'giza' | 'alex' | 'remote'>('all');\n  const [filterExp, setFilterExp] = useState<'all' | 'entry' | 'mid' | 'senior'>('all');\n  const [filterWorkType, setFilterWorkType] = useState<'all' | 'office' | 'hybrid' | 'remote'>('all');\n  const [showFiltersPanel, setShowFiltersPanel] = useState<boolean>(false);\n\n  // Candidate Interview Feedback\n  const [fbQ1, setFbQ1] = useState<string | null>(null);\n  const [fbQ2, setFbQ2] = useState<string | null>(null);\n\n  // Employer state\n  const [employerOnboardingStep, setEmployerOnboardingStep] = useState<number>(0);\n  const [jobForm, setJobForm] = useState({\n    title: '',\n    level: 0, // 0: Junior, 1: Mid, 2: Senior\n    salaryMin: '',\n    salaryMax: '',\n    exp: 0, // 0, 1, 2\n    days: 3,\n    presentationReq: false,\n    presentationWhy: '',\n  });\n  const [jobFormErrors, setJobFormErrors] = useState<{ t?: string; s?: string; w?: string }>({});\n  const [talentIndex, setTalentIndex] = useState<number>(0);\n  const [matchedCandidateId, setMatchedCandidateId] = useState<number>(0);\n  const [selectedSlot, setSelectedSlot] = useState<number | null>(null);\n  const [scheduledInterviews, setScheduledInterviews] = useState<{ c: number; sl: number }[]>([]);\n  const [employerDecisions, setEmployerDecisions] = useState<{ [key: number]: { d: 'i' | 'n'; r?: string } }>({});\n  const [applicantSelectedForDecision, setApplicantSelectedForDecision] = useState<number | null>(null);\n  const [decisionType, setDecisionType] = useState<'i' | 'n' | null>(null);\n  const [decisionReason, setDecisionReason] = useState<string | null>(null);\n  const [showDecisionModal, setShowDecisionModal] = useState<boolean>(false);\n  const [dismissedTalentIds, setDismissedTalentIds] = useState<number[]>([]);\n  const [employerTab, setEmployerTab] = useState<'interviews' | 'applicants'>('interviews');\n  const [employerFilter, setEmployerFilter] = useState<'all' | 'top' | 'junior' | 'mid' | 'advanced'>('all');\n  const [showSlotPickerModal, setShowSlotPickerModal] = useState<boolean>(false);\n  const [candidateToSchedule, setCandidateToSchedule] = useState<number | null>(null);\n  const [copiedMeetingLink, setCopiedMeetingLink] = useState<boolean>(false);\n\n  // Android & PWA Hook\n  const { isInstallable, isInstalled, install } = usePWAInstall();\n  const isOnline = useOnlineStatus();\n  const [showAndroidModal, setShowAndroidModal] = useState<boolean>(false);\n\n  // Timer ref\n  const timerRef = useRef<NodeJS.Timeout | null>(null);\n\n  // Sound effects state\n  const [soundOn, setSoundOn] = useState<boolean>(true);\n\n  const toggleSound = () => {\n    const next = !soundOn;\n    setSoundOn(next);\n    setSoundEnabled(next);\n    if (next) playClickSound();\n  };\n\n  const navigateScreen = (newScr: string) => {\n    playTransitionSound();\n    setScr(newScr);\n  };\n\n  // Translation helper\n  const t = (k: string): string => {\n    const primary = role === 'c' ? DC : role === 'k' ? DK : null;\n    const item = (primary && primary[k]) || DC[k] || DK[k] || D0[k];\n    if (!item) return k;\n    return item[langIndex];\n  };\n\n  const L = (pair: [string, string] | string[]): string => pair[langIndex] ?? pair[0] ?? '';\n\n  // Sync HTML lang and dir attribute\n  useEffect(() => {\n    document.documentElement.lang = langIndex === 1 ? 'ar' : 'en';\n    document.documentElement.dir = langIndex === 1 ? 'rtl' : 'ltr';\n  }, [langIndex]);\n\n  // Sync theme\n  useEffect(() => {\n    if (darkMode) {\n      document.documentElement.setAttribute('data-theme', 'dark');\n      document.documentElement.classList.add('dark');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n      document.documentElement.classList.remove('dark');\n    }\n  }, [darkMode]);\n\n  // Real-time listener for OS system preference changes (prefers-color-scheme: dark)\n  useEffect(() => {\n    if (typeof window === 'undefined' || !window.matchMedia) return;\n\n    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');\n    const handleSystemThemeChange = (e: MediaQueryListEvent) => {\n      try {\n        const savedPreference = localStorage.getItem('hireme_theme');\n        // If the user hasn't explicitly locked light/dark via manual toggle, auto-follow system\n        if (!savedPreference || savedPreference === 'system') {\n          setDarkMode(e.matches);\n        }\n      } catch {\n        setDarkMode(e.matches);\n      }\n    };\n\n    if (mediaQuery.addEventListener) {\n      mediaQuery.addEventListener('change', handleSystemThemeChange);\n      return () => mediaQuery.removeEventListener('change', handleSystemThemeChange);\n    } else if ((mediaQuery as any).addListener) {\n      (mediaQuery as any).addListener(handleSystemThemeChange);\n      return () => (mediaQuery as any).removeListener(handleSystemThemeChange);\n    }\n  }, []);\n\n  // Toast helper\n  const showToast = (msg: string) => {\n    setToastMessage(msg);\n    setTimeout(() => setToastMessage(''), 2500);\n  };\n\n  // Anti-cheating listeners during test\n  useEffect(() => {\n    if (scr !== 'test') return;\n\n    const handleCopyCutPaste = (e: ClipboardEvent) => {\n      e.preventDefault();\n      handleViolation('copy');\n    };\n\n    const handleVisibility = () => {\n      if (document.hidden) {\n        handleViolation('tab');\n      }\n    };\n\n    const handleContextMenu = (e: MouseEvent) => {\n      e.preventDefault();\n    };\n\n    window.addEventListener('copy', handleCopyCutPaste);\n    window.addEventListener('cut', handleCopyCutPaste);\n    window.addEventListener('paste', handleCopyCutPaste);\n    window.addEventListener('contextmenu', handleContextMenu);\n    document.addEventListener('visibilitychange', handleVisibility);\n\n    return () => {\n      window.removeEventListener('copy', handleCopyCutPaste);\n      window.removeEventListener('cut', handleCutPaste);\n      window.removeEventListener('paste', handleCutPaste);\n      window.removeEventListener('contextmenu', handleContextMenu);\n      document.removeEventListener('visibilitychange', handleVisibility);\n    };\n  }, [scr, strikes]);\n\n  const handleCutPaste = (e: ClipboardEvent) => {\n    e.preventDefault();\n    handleViolation('copy');\n  };\n\n  const handleViolation = (vKey: string) => {\n    if (timerRef.current) clearInterval(timerRef.current);\n    playWarningSound();\n    const newStrikes = strikes + 1;\n    setStrikes(newStrikes);\n    setViolationKey(vKey);\n    if (newStrikes >= 2) {\n      navigateScreen('blocked');\n    } else {\n      navigateScreen('cancelled');\n    }\n  };\n\n  // Exam Timer\n  useEffect(() => {\n    if (scr === 'test') {\n      setTimeLeft(60);\n      if (timerRef.current) clearInterval(timerRef.current);\n      timerRef.current = setInterval(() => {\n        setTimeLeft((prev) => {\n          if (prev <= 1) {\n            handleNextQuestion(true);\n            return 60;\n          }\n der-2 bg-[var(--sf)] text-sm font-medium outline-none transition ${\n                      authError.u ? 'border-[var(--er)]' : 'border-[var(--ln)] focus:border-[var(--pri)]'\n                    }`}\n                  />\n                  {authError.u && <p className=\"text-xs text-[var(--er)] mt-1 font-bold\">{authError.u}</p>}\n                </div>\n\n                <div>\n                  <label className=\"block text-xs font-bold mb-1.5\">{t('l_pw')}</label>\n                  <div className=\"relative\">\n                    <input\n                      type={showPassword ? 'text' : 'password'}\n                      value={password}\n                      onChange={(e) => setPassword(e.target.value)}\n                      placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\"\n                      className={`w-full h-12 px-3.5 pe-12 rounded-xl border-2 bg-[var(--sf)] text-sm font-medium outline-none transition ${\n                        authError.p ? 'border-[var(--er)]' : 'border-[var(--ln)] focus:border-[var(--pri)]'\n                      }`}\n                    />\n                    <button\n                      type=\"button\"\n                      onClick={() => setShowPassword(!showPassword)}\n                      className=\"absolute inset-y-0 end-0 px-3.5 flex items-center text-xs font-bold text-[var(--mu)]\"\n                    >\n                      {showPassword ? t('l_hide') : t('l_show')}\n                    </button>\n                  </div>\n                  {authError.p && <p className=\"text-xs text-[var(--er)] mt-1 font-bold\">{authError.p}</p>}\n                </div>\n\n                <div className=\"p-3 rounded-xl bg-[var(--okb)]/60 text-xs text-[var(--mu)] leading-relaxed\">\n                  {t('l_note')}\n                </div>\n              </div>\n\n              <div className=\"pt-4 space-y-3\">\n                <button\n                  onClick={handleLoginSubmit}\n                  className=               <div className=\"space-y-3 pt-2\">\n                {/* Active Skill: Excel */}\n                <div className=\"p-4 rounded-2xl border-2 border-[var(--pri)] bg-[var(--sf)] shadow-xs flex items-center justify-between\">\n                  <div>\n                    <div className=\"flex items-center gap-2\">\n                      <span className=\"font-extrabold text-base\">Excel</span>\n                      <span className=\"px-2 py-0.5 rounded-md bg-[var(--okb)] text-[var(--pri)] text-xs font-black\">\n                        {langIndex === 1 ? '\u0645\u0628\u062a\u062f\u0626' : 'Junior'}\n                      </span>\n                    </div>\n                    <p className=\"text-xs text-[var(--pri)] font-bold mt-1\">{t('det_this')}</p>\n                  </div>\n                  <Sparkles className=\"w-5 h-5 text-[var(--acc)]\" />\n                </div>\n\n                {/* Locked Skills */}\n                <div className=\"p-4 rounded-2xl border border-[var(--ln)] bg-[var(--sf)] opacity-65 flex items-center justify-between\">\n                  <div>\n                    <div className=\"flex items-center gap-2\">\n                      <span className=\"font-bold text-sm\">{langIndex === 1 ? '\u0625\u062f\u062e\u0627\u0644 \u0628\u064a\u0627\u0646\u0627\u062a' : 'Data Entry'}</span>\n                      <span className=\"px-2 py-0.5 rounded-md bg-slate-200 dark:bg-slate-700 text-xs font-bold\">\n                        {langIndex === 1 ? '\u0645\u0628\u062a\u062f\u0626' : 'Junior'}\n                      </span>\n                    </div>\n                    <p className=\"text-xs text-[var(--mu)] mt-0.5\">{t('det_lock')}</p>\n                  </div>\n                </div>\n\n                <div className=\"p-4 rounded-2xl border border-[var(--ln)] bg-[var(--sf)] opacity-65 flex items-center justify-between\">\n                  <div>\n                    <div className=\"flex items-center gap-2\">\n                      <span className=\"font-bold text-sm\">{langIndex === 1 ? '\u062e\u062f\u0645\u0629 \u0627\u0644\u0639\u0645\u0644\u0627\u0621' : 'Customer Service'}</span>\n                      <span className=\"px-2 py-0.5 rounded-md bg-slate-200 dark:bg-slate-700 text-xs font-bold\">\n                        {langIndex === 1 ? '\u0645\u062a\u0648\u0633\u0637' : 'Mid'}\n                      </span>\n                    </div>\n                    <p className=\"text-xs text-[var(--mu)] mt-0.5\">{t('det_lock')}</p>\n                  </div>\n                </div>\n\n                <p className=\"text-[11px] text-[var(--mu)] leading-relaxed pt-1\">{t('det_x')}</p>\n              </div>\n\n              <div className=\"pt-3\">\n                <button\n                  onClick={() => {\n                    setExamAgreed(false);\n                    setScr('rules');\n                  }}\n                  className=\"w-full h-12 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white font-extrabold text-sm shadow-md transition active:scale-98\"\n                >\n                  {t('det_btn')}\n                </button>\n              </div>\n            </div>\n          )}\n\n          {/* 5. CANDIDATE: EXAM SECURITY RULES */}\n          {scr === 'rules' && (\n            <div className=\"space-y-4 animate-up pt-1\">\n              <h1 className=\"text-2xl font-black\">{t('rl_t')}</h1>\n\n              <div className=\"space-y-2.5\">\n                {[1, 2, 3, 4].map((i) => (\n                  <div\n                    key={i}\n                    className={`p-3 rounded-2xl flex items-start gap-3 ${\n                      i > 2 ? 'bg-[var(--wn)]/70 text-[var(--tx)]' : 'bg-[var(--okb)]/60 text-[var(--tx)]'\n                    }`}\n                  >\n                    <span className=\"text-xl\">\n                      {['\ud83d\udcf7', '\ud83d\udeab', '\u26a0\ufe0f', '\u26d4'][i - 1]}\n                    </span>\n                    <div>\n                      <h4 className=\"font-extrabold text-xs\">{t(`rl_${i}t`)}</h4>\n                      <p className=\"text-[11px] text-[var(--mu)] mt-0.5 leading-relaxed\">{t(`rl_${i}`)}</p>\n                    </div>\n                  </div>\n                ))}\n              </div>\n\n              <p className=\"text-[11px] text-[var(--mu)]\">{t('rl_n')}</p>\n\n              {/* Agreement Switch */}\n              <div\n                onClick={() => setExamAgreed(!examAgreed)}\n                className=\"p-3.5 rounded-2xl border-2 border-[var(--ln)] bg-[var(--sf)] flex items-center justify-between cursor-pointer select-none\"\n              >\n                <span className=\"font-extrabold text-xs\">{t('rl_ok')}</span>\n                <div\n                  className={`w-12 h-6 rounded-full transition-colors relative flex items-center p-0.5 ${\n                    examAgreed ? 'bg-[var(--pri)]' : 'bg-[var(--ln)]'\n                  }`}\n                >\n                  <div\n                    className={`w-5 h-5 rounded-full bg-white shadow-md transform transition-transform ${\n                      examAgreed ? (langIndex === 1 ? '-translate-x-6' : 'translate-x-6') : 'translate-x-0'\n                    }`}\n                  />\n                </div>\n              </div>\n\n              <div className=\"space-y-2 pt-2\">\n                <button\n                  disabled={!examAgreed}\n                  onClick={() => setScr('ready')}\n                  className=\"w-full h-12 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] disabled:bg-[var(--ln)] disabled:text-[var(--mu)] text-white font-extrabold text-sm shadow-md transition active:scale-98\"\n                >\n                  {examAgreed ? t('rl_go') : t('rl_need')}\n                </button>\n                <button\n                  onClick={() => setScr('detect')}\n                  className=\"w-full h-10 rounded-xl border border-[var(--ln)] text-xs font-bold text-[var(--mu)]\"\n ton\n                            onClick={copyUdemyCode}\n                            className=\"flex-1 py-2 rounded-xl border border-[var(--ln)] font-bold text-xs\"\n                          >\n                            {t('ud_cp')}\n                          </button>\n                          <a\n                            href=\"https://www.udemy.com\"\n                            target=\"_blank\"\n                            rel=\"noopener noreferrer\"\n                            className=\"flex-1 py-2 rounded-xl bg-purple-700 hover:bg-purple-800 text-white font-bold text-xs text-center flex items-center justify-center gap-1\"\n                          >\n                            <span>{t('ud_open')}</span>\n                            <ExternalLink className=\"w-3 h-3\" />\n                          </a>\n                        </div>\n                      </div>\n\n                      {/* Retest info */}\n                      <div className=\"p-3 rounded-2xl bg-[var(--wn)] text-xs text-[var(--tx)] font-bold text-start\">\n                        <span>{t('rt_t')} 30 days</span>\n                        <p className=\"text-[11px] text-[var(--mu)] font-normal mt-0.5\">{t('rt_why')}</p>\n                      </div>\n\n                      {/* Educational Partners to prepare for next attempt */}\n                      <EducationalPartnersSection langIndex={langIndex} />\n\n                      <div className=\"space-y-2 pt-2\">\n                        <button\n                          onClick={startExam}\n                          className=\"w-full h-12 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white font-extrabold text-sm shadow-md transition\"\n                        >\n                          {t('retry')}\n                        </button>\n                        <button\n                          onClick={() => {\n                            setSkipRetest(true);\n                            startExam();\n top') return false;\n\n              // Location\n              if (filterLocation !== 'all' && j.locationArea !== filterLocation) return false;\n\n              // Experience\n              if (filterExp !== 'all' && j.expLevel !== filterExp) return false;\n\n              // Work type\n              if (filterWorkType !== 'all' && j.workType !== filterWorkType) return false;\n\n              return true;\n            });\n\n            return (\n              <div className=\"space-y-3.5 animate-up pt-1\">\n                {/* Verified Identity Notice */}\n                <div className=\"p-3 rounded-2xl bg-[var(--okb)] text-[var(--pri)] flex items-center gap-2 text-xs font-bold shadow-xs\">\n                  <span className=\"px-2 py-0.5 rounded bg-[var(--pri)] text-white font-black\">\n                    {t('badge')}\n                  </span>\n                  <span>{t('you')}</span>\n                </div>\n\n                {/* SEARCH BAR & FILTER TOGGLE */}\n                <div className=\"space-y-2\">\n                  <div className=\"flex items-center gap-2\">\n                    <div className=\"relative flex-1\">\n                      <Search className={`w-4 h-4 text-[var(--mu)] absolute ${langIndex === 1 ? 'right-3.5' : 'left-3.5'} top-1/2 -translate-y-1/2 pointer-events-none`} />\n                      <input\n                        type=\"text\"\n                        value={jobSearchQuery}\n                        onChange={(e) => setJobSearchQuery(e.target.value)}\n                        placeholder={\n                          langIndex === 1\n                            ? '\u0627\u0628\u062d\u062b \u0628\u0627\u0644\u0645\u0633\u0645\u0649\u060c \u0627\u0644\u0634\u0631\u0643\u0629\u060c \u0623\u0648 \u0627\u0644\u0645\u0648\u0642\u0639...'\n                            : 'Search job title, company, or location...'\n                        }\n                        className={`w-full h-11 ${\n                          langIndex === 1 ?
