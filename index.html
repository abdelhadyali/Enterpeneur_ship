<style>

@layer base {
  :root {
    --bg: #F4F7F7;

    --ln: #D7E1E3;

    --erb: #FBE9E7;
    --wn: #FFF1D6;
    --android-bar: #0B6E70;
  }

  [data-theme="dark"] {
    --bg: #0D1A24;
    --sf: #152633;
    --tx: #E9F1F4;
    --mu: #A5B8C4;
    --ln: #27404F;
    --pri: #0F7F82;

    --onp: #FFFFFF;

    --okb: #12362A;
    --er: #FFB4AB;
    --erb: #41201E;
    --wn: #3E3118;
    --android-bar: #0A141C;
  }

  body {
    font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #0b151f;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
}

/* Custom scrollbars */
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--ln);
  border-radius: 9999px;
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes pop {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes draw {
  from { stroke-dashoffset: 35; }
  to { stroke-dashoffset: 0; }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(11, 110, 112, 0.4); }
  50% { box-shadow: 0 0 0 10px rgba(11, 110, 112, 0); }
}

.animate-bob {
  animation: bob 2.6s ease-in-out infinite;
}

.animate-pop {
  animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
}

.animate-up {
  animation: up 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.animate-slide-in {
  animation: slideIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) both;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.chk-path {
  stroke-dasharray: 35;
  animation: draw 0.6s 0.2s cubic-bezier(0.65, 0, 0.45, 1) forwards;
}

.pulse-glow {
  animation: pulseGlow 2s infinite;
}

/* Tactile button feel */
.btn-tactile {
  transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.15s ease, background-color 0.15s ease;
}
.btn-tactile:active {
  transform: scale(0.96);
}

/* Staggered card appearance */
.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }
.stagger-5 { animation-delay: 0.25s; }

</style>

b seeker\", \"\u062a\u0633\u062c\u064a\u0644 \u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u062a\u0642\u062f\u0645\"],\n  l_k: [\"Log in as a company\", \"\u062a\u0633\u062c\u064a\u0644 \u062f\u062e\u0648\u0644 \u0627\u0644\u0634\u0631\u0643\u0629\"],\n  l_u: [\"Username or email\", \"\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0623\u0648 \u0627\u0644\u0628\u0631\u064a\u062f\"],\n  l_pw: [\"Password\", \"\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631\"],\n  l_show: [\"Show\", \"\u0625\u0638\u0647\u0627\u0631\"],\n  l_hide: [\"Hide\", \"\u0625\u062e\u0641\u0627\u0621\"],\n  l_go: [\"Log in\", \"\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062f\u062e\u0648\u0644\"],\n  l_note: [\n    \"Prototype: no real account is created. Any username and a password of 6+ characters works.\",\n    \"\u0646\u0645\u0648\u0630\u062c \u062a\u062c\u0631\u064a\u0628\u064a: \u0644\u0627 \u064a\u064f\u0634\u062a\u0631\u0637 \u0625\u0646\u0634\u0627\u0621 \u062d\u0633\u0627\u0628 \u0645\u0639\u0642\u062f. \u064a\u0639\u0645\u0644 \u0628\u0623\u064a \u0627\u0633\u0645 \u0645\u0633\u062a\u062e\u062f\u0645 \u0648\u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631 6+ \u0623\u062d\u0631\u0641.\"\n  ],\n  l_eu: [\"Enter your username or email.\", \"\u0623\u062f\u062e\u0644 \u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0623\u0648 \u0627\u0644\u0628\u0631\u064a\u062f.\"],\n  l_ep: [\"Password needs at least 6 characters.\", \"\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u062a\u062d\u062a\u0627\u062c 6 \u0623\u062d\u0631\u0641 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644.\"],\n  l_back: [\"Change role\", \"\u062a\u063a\u064a\u064a\u0631 \u0627\u0644\u062f\u0648\u0631\"],\n  out: [\"Log out\", \"\u062e\u0631\u0648\u062c\"],\n  cv_t: [\"Upload your CV\", \"\u0627\u0631\u0641\u0639 \u0633\u064a\u0631\u062a\u0643 \u0627\u0644\u0630\u0627\u062a\u064a\u0629\"],\n  cv_p: [\"We read it to find your skills. Then you verify them with a short check.\", \"\u0646\u0642\u0631\u0624\u0647\u0627 \u0644\u0646\u0643\u062a\u0634\u0641 \u0645\u0647\u0627\u0631\u0627\u062a\u0643. \u062b\u0645 \u062a\u0648\u062b\u0651\u0642\u0647\u0627 \u0628\u0627\u062e\u062a\u0628\u0627\u0631 \u0639\u0645\u0644\u064a \u0642\u0635\u064a\u0631.\"],\n  cv_up: [\"Choose CV file\", \"\u0627\u062e\u062a\u0631 \u0645\u0644\u0641 \u0627\u0644\u0633\u064a\u0631\u0629\"],\n  cv_hint: [\"PDF, DOC or DOCX, up to 5 MB\", \"PDF \u0623\u0648 DOC \u0623\u0648 DOCX \u062d\u062a\u0649 5 \u0645\u064a\u062c\u0627\"],\n  cv_sample: [\"Use a sample CV\", \"\u0627\u0633\u062a\u062e\u062f\u0645 \u0633\u064a\u0631\u0629 \u062a\u062c\u0631\u064a\u0628\u064a\u0629\"],\n  cv_read: [\"Reading your CV\u2026\", \"\u062c\u0627\u0631\u064a \u0642\u0631\u0627\u0621\u0629 \u0648\u062a\u062d\u0644\u064a\u0644 \u0633\u064a\u0631\u062a\u0643\u2026\"],\n  cv_err: [\"This file type is not supported. Use PDF, DOC or DOCX.\", \"\u0646\u0648\u0639 \u0627\u0644\u0645\u0644\u0641 \u063a\u064a\u0631 \u0645\u062f\u0639\u0648\u0645. \u0627\u0633\u062a\u062e\u062f\u0645 PDF \u0623\u0648 DOC \u0623\u0648 DOCX.\"],\n  cv_big: [\"The file is larger than 5 MB.\", \"\u062d\u062c\u0645 \u0627\u0644\u0645\u0644\u0641 \u0623\u0643\u0628\u0631 \u0645\u0646 5 \u0645\u064a\u062c\u0627.\"],\n  det_t: [\"We found 3 skills in your CV\", \"\u0648\u062c\u062f\u0646\u0627 3 \u0645\u0647\u0627\u0631\u0627\u062a \u0641\u064a \u0633\u064a\u0631\u062a\u0643\"],\n  det_p: [\"Verify them to unlock jobs. Start with Excel.\", \"\u0648\u062b\u0651\u0642\u0647\u0627 \u0644\u062a\u0641\u062a\u062d \u0627\u0644\u0648\u0638\u0627\u0626\u0641. \u0627\u0628\u062f\u0623 \u0628\u0640 Excel.\"],\n  det_x: [\n    \"Prototype: these skills are examples. Excel practical test is active in this version.\",\n    \"\u0646\u0645\u0648\u0630\u062c \u062a\u062c\u0631\u064a\u0628\u064a: \u0627\u0644\u0645\u0647\u0627\u0631\u0627\u062a \u062a\u0645 \u0627\u0633\u062a\u062e\u0631\u0627\u062c\u0647\u0627 \u062a ednesday 02:00 PM\", \"\u0627\u0644\u0623\u0631\u0628\u0639\u0627\u0621 02:00 \u0638\u0647\u0631\u0627\u064b\"],\n  [\"Thursday 10:00 AM\", \"\u0627\u0644\u062e\u0645\u064a\u0633 10:00 \u0635\u0628\u0627\u062d\u0627\u064b\"],\n  [\"Sunday 01:00 PM\", \"\u0627\u0644\u0623\u062d\u062f 01:00 \u0638\u0647\u0631\u0627\u064b\"],\n  [\"Monday 03:30 PM\", \"\u0627\u0644\u0627\u062b\u0646\u064a\u0646 03:30 \u0639\u0635\u0631\u0627\u064b\"],\n];\n\n\n\n// ===== src/soundEffects.ts =====\n// Web Audio API Synthesizer for instant, zero-latency, zero-dependency tactile sounds\n\nlet audioCtx: AudioContext | null = null;\nlet soundEnabled = true;\n\nfunction getAudioContext(): AudioContext | null {\n  if (typeof window === 'undefined') return null;\n  if (!audioCtx) {\n    const AudioContextClass = window.AudioContext || (window as unknown as { webkitAudioContext: typeof AudioContext }).webkitAudioContext;\n    if (AudioContextClass) {\n      audioCtx = new AudioContextClass();\n    }\n  }\n  if (audioCtx && audioCtx.state === 'suspended') {\n    audioCtx.resume();\n  }\n  return audioCtx;\n}\n\nfunction setSoundEnabled(enabled: boolean) {\n  soundEnabled = enabled;\n}\n\nfunction isSoundEnabled() {\n  return soundEnabled;\n}\n\n/**\n * Subtle tactile click sound (like native Android / iOS haptic tap)\n */\nfunction playClickSound() {\n  if (!soundEnabled) return;\n  try {\n    const ctx = getAudioContext();\n    if (!ctx) return;\n\n    const osc = ctx.createOscillator();\n    const gain = ctx.createGain();\n\n    osc.type = 'sine';\n    const now = ctx.currentTime;\n\n    // Pitch drops quickly from 1200Hz to 300Hz for a crisp click\n    osc.frequency.setValueAtTime(1100, now);\n    osc.frequency.exponentialRampToValueAtTime(260, now + 0.035);\n\n    gain.gain.setValueAtTime(0.08, now);\n    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);\n\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n\n    osc.start(now);\n    osc.stop(now + 0.038);\n  } catch {\n    // Graceful fallback if audio is blocked\n  }\n}\n\n/**\n * Screen transition sound (gentle airy woosh)\n */\nfunction playTransitionSound() {\n  if (!soundEnabled) return;\n  try {\n    const ctx = getAudioContext();\n    if (!ctx) return;\n\n    const now = ctx.currentTime;\n    const osc = ctx.createOscillator();\n    const gain = ctx.createGain();\n\n    osc.type = 'sine';\n    osc.frequency.setValueAtTime(420, now);\n    osc.frequency.exponentialRampToValueAtTime(640, now + 0.07);\n\n    gain.gain.setValueAtTime(0.04, now);\n    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);\n\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n\n    osc.start(now);\n    osc.stop(now + 0.075);\n  } catch {\n    // Ignore audio errors\n  }\n}\n\n/**\n * Success harmonic chime (for tests passed, match achieved, application sent)\n */\nfunction playSuccessSound() {\n  if (!soundEnabled) return;\n  try {\n    const ctx = getAudioContext();\n    if (!ctx) return;\n\n    const now = ctx.currentTime;\n    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 major triad\n\n    notes.forEach((freq, idx) => {\n      const osc = ctx.createOscillator();\n      const gain = ctx.createGain();\n\n      osc.type = 'triangle';\n      osc.frequency.setValueAtTime(freq, now + idx * 0.07);\n\n      gain.gain.setValueAtTime(0, now + idx * 0.07);\n      gain.gain.linearRampToValueAtTime(0.08, now + idx * 0.07 + 0.02);\n      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.22);\n\n      osc.connect(gain);\n      gain.connect(ctx.destination);\n\n      osc.start(now + idx * 0.07);\n      osc.stop(now + idx * 0.07 + 0.23);\n    });\n  } catch {\n    // Ignore audio errors\n  }\n}\n\n/**\n * Alert / strike sound\n */\nfunction playWarningSound() {\n  if (!soundEnabled) return;\n  try {\n    const ctx = getAudioContext();\n    if (!ctx) return;\n\n    const now = ctx.currentTime;\n    const osc = ctx.createOscillator();\n    const gain = ctx.createGain();\n\n    osc.type = 'sawtooth';\n    osc.frequency.setValueAtTime(260, now);\n    osc.frequency.linearRampToValueAtTime(180, now + 0.12);\n\n    gain.gain.setValueAtTime(0.05, now);\n    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);\n\n    osc.connect(gain);\n    gain.connect(ctx.destination);\n\n    osc.start(now);\n    osc.stop(now + 0.13);\n  } catch {\n    // Ignore audio errors\n  }\n}\n\n\n// ===== src/calendarUtils.ts =====\n// Calendar Integration Helper for Google Calendar and iCal (.ics) download\n\nfunction getGoogleCalendarUrl(title: string, description: string, location: string, slotText: string): string {\n  // Approximate a date relative to now\n  const start = new Date();\n  start.setDate(start.getDate() + 2);\n  start.setHours(11, 0, 0, 0);\n  const end = new Date(start);\n  end.setMinutes(end.getMinutes() + 45);\n\n  const formatTime = (d: Date) => d.toISOString().replace(/-|:|\\.\\d\\d\\d/g, '');\n\n  const params = new URLSearchParams({\n    action: 'TEMPLATE',\n    text: title,\n    details: description + `\\n\\nScheduled slot: ${slotText}`,\n    location: location,\n    dates: `${formatTime(start)}/${formatTime(end)}`,\n  });\n\n  return `https://calendar.google.com/calendar/render?${params.toString()}`;\n}\n\nfunction downloadIcsFile(title: string, description: string, location: string, slotText: string, filename = 'interview.ics'): void {\n  const start = new Date();\n  start.setDate(start.getDate() + 2);\n  start.setHours(11, 0, 0, 0);\n  const end = new Date(start);\n  end.setMinutes(end.getMinutes() + 45);\n\n  const formatIcsTime = (d: Date) => d.toISOString().replace(/-|:|\\.\\d\\d\\d/g, '');\n\n  const icsContent = [\n    'BEGIN:VCALENDAR',\n    'VERSION:2.0',\n    'PRODID:-//HIRE ME//Skills Verification & Hiring//EN',\n    'CALSCALE:GREGORIAN',\n    'METHOD:PUBLISH',\n    'BEGIN:VEVENT',\n    `SUMMARY:${title}`,\n    `DESCRIPTION:${description.replace(/\\n/g, '\\\\n')} - Slot: ${slotText}`,\n    `LOCATION:${location}`,\n    `DTSTART:${formatIcsTime(start)}`,\n    `DTEND:${formatIcsTime(end)}`,\n    `STATUS:CONFIRMED`,\n    'END:VEVENT',\n    'END:VCALENDAR',\n  ].join('\\r\\n');\n\n  const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = filename;\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n\n\n// ===== src/useOnlineStatus.ts =====\n\n\nfunction useOnlineStatus() {\n  const [isOnline, setIsOnline] = useState(\n    typeof navigator !== 'undefined' ? navigator.onLine : true\n  );\n\n  useEffect(() => {\n    const handleOnline = () => setIsOnline(true);\n    const handleOffline = () => setIsOnline(false);\n\n    window.addEventListener('online', handleOnline);\n    window.addEventListener('offline', handleOffline);\n\n    return () => {\n      window.removeEventListener('online', handleOnline);\n      window.removeEventListener('offline', handleOffline);\n    };\n  }, []);\n\n  return isOnline;\n}\n\n\n// ===== src/usePWAInstall.ts =====\n\n\ninterface BeforeInstallPromptEvent extends Event {\n  prompt: () => Promise<void>;\n  userChoice: Promise<{ outcome: 'accepted' | 'dismissed'; platform: string }>;\n}\n\nfunction usePWAInstall() {\n  const [deferredPrompt, setDeferredPrompt] = useState<BeforeInstallPromptEvent | null>(null);\n  const [isInstalled, setIsInstalled] = useState(false);\n  const [isAndroid, setIsAndroid] = useState(false);\n  const [isIOS, setIsIOS] = useState(false);\n\n  useEffect(() => {\n    // Check if running in standalone mode (installed as PWA/WebAPK)\n    const isStandalone =\n      window.matchMedia('(display-mode: standalone)').matches ||\n      (window.navigator as unknown as { standalone?: boolean }).standalone === true ||\n      document.referrer.includes('android-app://');\n\n    setIsInstalled(isStandalone);\n\n    const ua = window.navigator.userAgent.toLo        {/* Description */}\n            <p className=\"text-xs text-[var(--tx)] leading-relaxed bg-[var(--bg)] p-3 rounded-2xl border border-[var(--ln)]\">\n              {selectedPartner.description[langIndex]}\n            </p>\n\n            {/* Exclusive Perk & Voucher */}\n            <div className=\"p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700/60 space-y-2\">\n              <div className=\"flex items-center justify-between\">\n                <span className=\"text-xs font-black text-amber-800 dark:text-amber-300 flex items-center gap-1\">\n                  <Sparkles className=\"w-3.5 h-3.5\" />\n                  {isAr ? '\u0627\u0644\u0645\u064a\u0632\u0629 \u0627\u0644\u062d\u0635\u0631\u064a\u0629 \u0644\u0645\u0631\u0634\u062d\u064a Hire Me:' : 'Exclusive Hire Me Applicant Perk:'}\n                </span>\n                <span className=\"px-2 py-0.5 rounded-full bg-amber-200 dark:bg-amber-900 text-amber-900 dark:text-amber-200 font-extrabold text-[10px]\">\n                  {selectedPartner.discount}\n                </span>\n              </div>\n              <p className=\"text-xs font-bold text-[var(--tx)]\">\n                {selectedPartner.perk[langIndex]}\n              </p>\n\n              {/* Voucher Code Box */}\n              <div className=\"flex items-center justify-between bg-[var(--sf)] p-2.5 rounded-xl border border-amber-300/80 dark:border-amber-700/80\">\n                <div>\n                  <span className=\"text-[10px] font-bold text-[var(--mu)] block\">\n                    {isAr ? '\u0631\u0645\u0632 \u0627\u0644\u0643\u0648\u0628\u0648\u0646 \u0627\u0644\u062a\u0631\u0648\u064a\u062c\u064a:' : 'Promo Voucher Code:'}\n                  </span>\n                  <span className=\"font-mono font-black text-xs text-[var(--pri)] tracking-wider\">\n                    {selectedPartner.voucherCode}\n                  </span>\n                </div>\n                <button\n --mu)] font-bold\">\n                        {trk.level[langIndex]} \u00b7 {trk.hours}\n                      </span>\n                    </div>\n                    <span className=\"px-2 py-0.5 rounded-full bg-[var(--okb)] text-[var(--pri)] text-[10px] font-black\">\n                      {isAr ? '\u0645\u0639\u062a\u0645\u062f' : 'Verified'}\n                    </span>\n                  </div>\n                ))}\n              </div>\n            </div>\n\n            {/* Actions */}\n            <div className=\"flex gap-2 pt-1\">\n              <button\n                onClick={() => setSelectedPartner(null)}\n                className=\"flex-1 py-2.5 rounded-xl border border-[var(--ln)] text-xs font-extrabold text-[var(--mu)] hover:text-[var(--tx)]\"\n              >\n                {isAr ? '\u0625\u063a\u0644\u0627\u0642' : 'Close'}\n              </button>\n              <a\n                href={selectedPartner.websiteUrl}\n                target=\"_blank\"\n                rel=\"noopener noreferrer\"\n                className=\"flex-1 py-2.5 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white text-xs font-extrabold flex items-center justify-center gap-1.5 shadow-xs transition\"\n              >\n                <span>{isAr ? '\u0632\u064a\u0627\u0631\u0629 \u0627\u0644\u0645\u0646\u0635\u0629' : 'Visit Platform'}</span>\n                <ExternalLink className=\"w-3.5 h-3.5\" />\n              </a>\n            </div>\n          </div>\n        </div>\n      )}\n    </section>\n  );\n};\n\n\n// ===== src/ProfileTab.tsx =====\n\n\n\n\n\n// Mock data simulating candidate proficiency and market demand\nconst MARKET_SKILLS_DEMAND = {\n  'Excel': { demand: 95, course: 'udemy' },\n  'SQL': { demand: 85, course: 'datacamp' },\n  'Power BI': { demand: 80, course: 'datacamp' },\n  'Data Cleaning': { demand: 75, course: 'coursera' },\n  'Financial Modeling': { demand: 70, course: 'udemy' },\n  'DAX': { demand: 65, course: 'linkedin' }\n};\n\nconst CANDIDATE_SKILLS = {\n  'Excel': 0, // Dynamic\n  'SQL': 0,\n  'Power BI': 40,\n  'Data Cleaning': 90,\n  'Financial Modeling': 0,\n  'DAX': 20\n};\n\ninterface ProfileTabProps {\n  langIndex: number;\n  answers: number[];\n}\n\nconst ProfileTab: React.FC<ProfileTabProps> = ({ langIndex, answers }) => {\n  const isAr = langIndex === 1;\n\n  // Calculate Excel score from test results\n  const excelScore = answers && answers.length > 0 \n    ? Math.round((answers.filter((a, i) => a === QUESTIONS[i].c).length / QUESTIONS.length) * 100)\n    : 0;\n\n  const skills = {\n    ...CANDIDATE_SKILLS,\n    'Excel': excelScore\n  };\n\n  // Calculate suitability score (average of all skills)\n  const totalSkills = Object.values(skills).length;\n  const sumSkills = Object.values(skills).reduce((acc, curr) => acc + curr, 0);\n  const suitabilityScore = totalSkills > 0 ? Math.round(sumSkills / totalSkills) : 0;\n  \n  // Color logic for suitability\n  const suitabilityColor = suitabilityScore >= 90 ? 'text-emerald-500' : suitabilityScore >= 70 ? 'text-amber-500' : 'text-red-500';\n\n  return (\n    <div className=\"space-y-6 animate-up pt-1\">\n      {/* Profile Header */}\n      <div className=\"flex items-center gap-4 bg-[var(--sf)] p-4 rounded-3xl border border-[var(--ln)] shadow-xs\">\n        <div className=\"w-16 h-16 rounded-full bg-[var(--pri)] flex items-center justify-center text-white text-2xl font-black\">\n          MD\n        </div>\n        <div>\n          <h2 className=\"font-black text-lg text-[var(--tx)]\">Mohamed DutyFree</h2>\n          <p className=\"text-xs text-[var(--mu)] font-bold\">Data Analyst Candidate</p>\n        </div>\n        <div className=\"ms-auto\">\n          <Award className=\"w-8 h-8 text-[var(--acc)]\" />\n        </div>\n      </div>\n\n      {/* Suitability Score Section */}\n      <div className=\"bg-[var(--sf)] p-4 rounded-2xl border border-[var(--ln)] space-y-2 text-center\">\n        <h4 className=\"font-bold text-xs text-[var(--mu)]\">\n          {isAr ? '\u0627\u062d\u062a\u0645\u0627\u0644\u064a\u0629 \u0642\u0628\u0648\u0644\u0643 \u0627\u0644\u0648\u0638\u064a\u0641\u064a' : 'Job Application Suitability'}\n        </h4>\n        <div className={`text-4xl font-black ${suitabilityColor}`}>\n          {suitabilityScore}%\n        </div>\n        <p className=\"text-xs text-[var(--tx)] font-medium\">\n          {isAr \n            ? `\u0628\u0646\u0627\u0621\u064b \u0639\u0644\u0649 \u0633\u064a\u0631\u062a\u0643 \u0627\u0644\u0630\u0627\u062a\u064a\u0629 \u0648\u0645\u0647\u0627\u0631\u0627\u062a\u0643 \u0627\u0644\u062d\u0627\u0644\u064a\u0629\u060c \u0641\u0631\u0635\u062a\u0643 \u0644\u0644\u0642\u0628\u0648\u0644 \u0647\u064a ${suitabilityScore}%`\n            : `Based on your CV and current skills, your suitability score is ${suitabilityScore}%`}\n        </p>\n      </div>\n\n      {/* Skills Ranking Section */}\n      <div className=\"space-y-4\">\n        <h3 className=\"font-black text-base text-[var(--tx)]\">{isAr ? '\u062a\u0642\u064a\u064a\u0645 \u0627\u0644\u0645\u0647\u0627\u0631\u0627\u062a \u0648\u0633\u0648\u0642 \u0627\u0644\u0639\u0645\u0644' : 'Skills & Market Ranking'}</h3>\n        \n        {Object.entries(MARKET_SKILLS_DEMAND).map(([skill, meta]) => {\n          const rank = skills[skill as keyof typeof skills] || 0;\n          const partner = EDUCATIONAL_PARTNERS.find(p => p.id === meta.course);\n          \n          // Color logic: 100% -> Green, >=75% -> Primary, <75% -> Amber\n          const barColorClass = rank >= 100 ? 'bg-emerald-500' : rank >= 75 ? 'bg-[var(--pri)]' : 'bg-amber-500';\n\n          return (\n            <div key={skill} className=\"bg-[var(--sf)] p-4 rounded-2xl border border-[var(--ln)] space-y-2\">\n              <div className=\"flex items-center justify-between\">\n                <span className=\"font-bold text-sm text-[var(--tx)]\">{skill}</span>\n                <span className=\"text-xs font-black text-[var(--pri)]\">{rank}% {isAr ? '\u062a\u0635\u0646\u064a\u0641\u0643' : 'Rank'}</span>\n              </div>\n              \n              {/* Progress Bar */}\n              <div className=\"h-2 bg-[var(--bg)] rounded-full overflow-hidden\">\n                <div \n                  className={`h-full ${barColorClass} rounded-full transition-all duration-500`}\n                  style={{ width: `${rank}%` }}\n                />\n              </div>\n\n              {/* Recommendations */}\n              {rank < 100 && (\n                <div className=\"flex items-center justify-between pt-1\">\n                  <p className=\"text-[10px] text-[var(--mu)] font-medium\">\n                    {rank === 0\n                      ? (isAr \n                          ? `\u063a\u064a\u0631 \u0645\u0648\u062c\u0648\u062f\u0629 \u0641\u064a \u0633\u064a\u0631\u062a\u0643 \u0627\u0644\u0630\u0627\u062a\u064a\u0629! (${meta.demand}% \u0645\u0646 \u0627\u0644\u0634\u0631\u0643\u0627\u062a \u062a\u0637\u0644\u0628\u0647\u0627)` \n                          : `Not in your CV! (${meta.demand}% of companies require this)`)\n                      : rank < 75 \n                      ? (isAr \n                          ? `\u0645\u0647\u0627\u0631\u0629 \u062a\u062d\u062a\u0627\u062c \u062a\u0637\u0648\u064a\u0631 \u0639\u0627\u062c\u0644! (${meta.demand}% \u0645\u0646 \u0627\u0644\u0634\u0631\u0643\u0627\u062a \u062a\u0637\u0644\u0628\u0647\u0627)` \n                          : `Urgent skill improvement needed! (${meta.demand}% of companies require this)`)\n                      : (isAr ? `\u0645\u0645\u0643\u0646 \u062a\u0631\u0641\u0639 \u0645\u0647\u0627\u0631\u0627\u062a\u0643 \u0644\u0640 100%` : `Can improve skill to 100%`)\n                    }\n                  </p>\n                  {partner && (\n                    <a \n                      href={partner.websiteUrl}\n                      target=\"_blank\"\n                      rel=\"noopener noreferrer\"\n                      className=\"flex items-center gap-1 text-[10px] font-black text-[var(--pri)] hover:underline\"\n                    >\n                      <BookOpen className=\"w-3 h-3\" />\n                      {isAr ? '\u062a\u0639\u0644\u0645 \u0627\u0644\u0645\u0632\u064a\u062f' : 'Learn More'}\n                    </a>\n                  )}\n                </div>\n              )}\n            </div>\n          );\n        })}\n      </div>\n    </div>\n  );\n};\n\n\n// ===== src/SalaryMarketBar.tsx =====\n\n\n\n\ninterface SalaryMarketBarProps {\n  job: JobItem;\n  langIndex: number; // 0 for EN, 1 for AR\n  expanded?: boolean;\n}\n\nconst SalaryMarketBar: React.FC<SalaryMarketBarProps> = ({\n  job,\n  langIndex,\n  expanded = false,\n}) => {\n  const isAr = langIndex === 1;\n\n  // Safe calculation of percentages relative to market spectrum\n  const span = Math.max(1, job.marketMax - job.marketMin);\n  const startPct = Math.max(0, Math.min(92, ((job.salaryMin - job.marketMin) / span) * 100));\n  const rawEndPct = Math.max(startPct + 8, Math.min(100, ((job.salaryMax - job.marketMin) / span) * 100));\n  const widthPct = Math.max(8, rawEndPct - startPct);\n  const medianPct = Math.max(5, Math.min(95, ((job.marketMedian - job.marketMin) / span) * 100));\n\n  // Visual style by tier\n  const isTop = job.marketTier === 'top';\n  const isAbove = job.marketTier === 'above';\n\n  const badgeBg = isTop\n    ? 'bg-amber-100 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border-amber-300 dark:border-amber-700'\n    : isAbove\n    ? 'bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700'\n    : 'bg-teal-100 dark:bg-teal-950/50 text-teal-800 dark:text-teal-300 border-teal-300 dark:border-teal-700';\n\n  const barGradient = isTop\n    ? 'from-amber-500 via-orange-500 to-amber-400 shadow-amber-500/30'\n    : isAbove\n    ? 'from-emerald-600 via-teal-600 to-emerald-400 shadow-emerald-500/30'\n    : 'from-[#0B6E70] to-teal-500 shadow-teal-500/30';\n\n  const formatEgp = (num: number) => {\n    return isAr ? `${num.toLocaleString('ar-EG')} \u062c.\u0645` : `${num.toLocaleString()} EGP`;\n  };\n\n  return (\n    <div\n      className={`rounded-2xl border transition-all ${\n        expanded\n          ? 'p-4 bg-[var(--sf)] border-[var(--pri)]/40 shadow-sm'\n          : 'p-3 bg-[var(--sf)]/70 dark:bg-slate-800/40 border-[var(--ln)]'\n      }`}\n    >\n      {/* Top Header of Salary Widget */}\n      <div className=\"flex items-center justify-between gap-2 mb-2\">\n        <div className=\"flex items-center gap-1.5\">\n          <TrendingUp className=\"w-3.5 h-3.5 text-[var(--pri)]\" />\n          <span className=\"text-[11px] font-bold text-[var(--mu)]\">\n            {isAr ? '\u0639\u0631\u0636 \u0627\u0644\u0631\u0627\u062a\u0628 \u0645\u0642\u0627\u0631\u0646\u0629 \u0628\u0627\u0644\u0633\u0648\u0642' : 'Salary vs Market Benchmark'}\n          </span>\n        </div>\n        <span\n          className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold border flex items-center gap-1 ${badgeBg}`}\n        >\n          {isTop ? <Award className=\"w-3 h-3\" /> : <CheckCircle className=\"w-3 h-3\" />}\n          {job.marketComparison[langIndex]}\n        </span>\n      </div>\n\n      {/* Numerical Salary Range */}\n      <div className=\"flex items-baseline justify-between mb-2\">\n        <div className=\"flex items-baseline gap-1.5\">\n          <span className=\"text-sm font-black text-[var(--pri)]\">\n            {job.sal}\n          </span>\n          <span className=\"text-[11px] font-bold text-[var(--tx)]\">\n            {isAr ? '\u062c\u0646\u064a\u0647 \u0634\u0647\u0631\u064a\u0627\u064b' : 'EGP / month'}\n          </span>\n        </div>\n        <div className=\"text-[10px] text-[var(--mu)] font-medium\">\n          {isAr ? '\u0645\u062a\u0648\u0633\u0637 \u0627\u0644\u0633\u0648\u0642:' : 'Market Avg:'}{' '}\n          <strong className=\"text-[var(--tx)]\">{formatEgp(job.marketMedian)}</strong>\n        </div>\n      </div>\n\n      {/* Progress Bar Container (Always LTR numeric axis for clarity: Min -> Median -> Max) */}\n      <div className=\"relative pt-3 pb-1\" dir=\"ltr\">\n        {/* Median Pin Callout */}\n        <div\n          className=\"absolute -top-1 transform -translate-x-1/2 flex flex-col items-center pointer-events-none z-10\"\n          style={{ left: `${medianPct}%` }}\n        >\n          <span className=\"text-[9px] font-black px-1.5 py-0.2 rounded-sm bg-slate-800 text-slate-100 shadow-xs\">\n            {isAr ? '\u0627\u0644\u0645\u062a\u0648\u0633\u0637' : 'Avg'}\n          </span>\n          <div className=\"w-0.5 h-1.5 bg-slate-800\"></div>\n        </div>\n\n        {/* Outer Track Bar */}\n        <div className=\"h-3 w-full bg-slate-200 dark:bg-slate-700/70 rounded-full relative overflow-visible flex items-center\">\n          {/* Subtle market gradient behind */}\n          <div className=\"absolute inset-0 rounded-full bg-gradient-to-r from-slate-200 via-teal-100/50 to-slate-200 dark:from-slate-700 dark:via-teal-950/40 dark:to-slate-700 opacity-80\" />\n\n          {/* Median vertical divider */}\n          <div\n            className=\"absolute top-0 bottom-0 w-0.5 bg-slate-500/60 z-10\"\n            style={{ left: `${medianPct}%` }}\n          />\n\n          {/* Highlighted Job Salary Range Segment */}\n          <div\n            className={`absolute h-3.5 -top-[1px] rounded-full bg-gradient-to-r ${barGradient} shadow-md z-20 border border-white/60 dark:border-black/40 transition-all duration-500`}\n            style={{\n              left: `${startPct}%`,\n              width: `${widthPct}%`,\n            }}\n          >\n            {/* Pulsing indicator at right edge */}\n            <div className=\"absolute right-0.5 top-0.5 w-2 h-2 rounded-full bg-white/90 animate-pulse\" />\n          </div>\n        </div>\n\n        {/* Milestone Labels below the bar */}\n        <div className=\"flex justify-between items-center text-[10px] text-[var(--mu)] font-semibold mt-1 px-0.5\">\n          <span>{formatEgp(job.marketMin)}</span>\n          <span className=\"text-[var(--tx)] font-bold\">{formatEgp(job.marketMedian)}</span>\n          <span>{formatEgp(job.marketMax)}</span>\n        </div>\n      </div>\n\n      {/* Expanded description (visible in job detail screen) */}\n      {expanded && (\n        <div className=\"mt-3 pt-3 border-t border-[var(--ln)]/60 space-y-2 text-xs\">\n          <div className=\"flex items-center gap-2 text-[var(--tx)] font-bold\">\n            <BarChart3 className=\"w-4 h-4 text-[var(--pri)]\" />\n            <span>\n              {isAr ? '\u062a\u0642\u064a\u064a\u0645 \u0627\u0644\u0634\u0641\u0627\u0641\u064a\u0629 \u0648\u0639\u062f\u0627\u0644\u0629 \u0627\u0644\u0623\u062c\u0631:' : 'Wage Transparency & Fairness Audit:'}\n            </span>\n          </div>\n          <p className=\"text-[11px] text-[var(--mu)] leading-relaxed\">\n            {isAr\n              ? `\u0647\u0630\u0627 \u0627\u0644\u0639\u0631\u0636 \u064a\u0628\u062f\u0623 \u0645\u0646 ${job.salaryMin.toLocaleString()} \u062c.\u0645 \u0648\u064a\u0635\u0644 \u0625\u0644\u0649 ${job.salaryMax.toLocaleString()} \u062c.\u0645\u060c \u0648\u0647\u0648 \u0623\u0639\u0644\u0649 \u0645\u0646 \u0645\u062a\u0648\u0633\u0637 \u0633\u0648\u0642 \u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u062d\u0627\u0644\u064a (${job.marketMedian.toLocaleString()} \u062c.\u0645) \u0644\u0647\u0630\u0647 \u0627\u0644\u0645\u0647\u0627\u0631\u0629 \u0648\u0627\u0644\u062e\u0628\u0631\u0629 \u0627\u0644\u0645\u0637\u0644\u0648\u0628\u0629\u060c \u0645\u0645\u0627 \u064a\u062c\u0639\u0644\u0647 \u0639\u0631\u0636\u0627\u064b \u062a\u0646\u0627\u0641\u0633\u064a\u0627\u064b \u0645\u0645\u062a\u0627\u0632\u0627\u064b.`\n              : `This offer starts at ${job.salaryMin.toLocaleString()} EGP and tops at ${job.salaryMax.toLocaleString()} EGP, positioned comfortably above the regional median (${job.marketMedian.toLocaleString()} EGP) for this level of verified expertise.`}\n          </p>\n        </div>\n      )}\n    </div>\n  );\n};\n\n\n// ===== src/VerifiedExamBadge.tsx =====\n\n\n\ninterface VerifiedExamBadgeProps {\n  score: number;\n  skillName?: string;\n  badgeId?: string;\n  isFastLearner?: boolean;\n  compact?: boolean;\n  langIndex: number;\n}\n\nconst VerifiedExamBadge: React.FC<VerifiedExamBadgeProps> = ({\n  score,\n  skillName = 'Excel \u00b7 Junior',\n  badgeId = 'HM-VERIFIED-2025',\n  isFastLearner = false,\n  compact = false,\n  langIndex,\n}) => {\n  const isAr = langIndex === 1;\n\n  if (compact) {\n    return (\n      <div className=\"inline-flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-emerald-950/40 dark:to-teal-950/40 border-2 border-emerald-500/40 shadow-xs\">\n        {/* Mini Gold Seal */}\n        <div className=\"w-6 h-6 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-xs flex-shrink-0\">\n          <CheckCircle2 className=\"w-3.5 h-3.5\" />\n        </div>\n        <div className=\"flex flex-col text-start\">\n          <div className=\"flex items-center gap-1.5\">\n            <span className=\"text-[11px] font-black text-emerald-700 dark:text-emerald-300\">\n              {isAr ? '\u0634\u0627\u0631\u0629 \u062a\u0648\u062b\u064a\u0642 \u0645\u0639\u062a\u0645\u062f\u0629' : 'Verified Badge'}\n            </span>\n            <span className=\"px-1.5 py-0.2 rounded-md bg-emerald-600 text-white text-[10px] font-black\">\n              {score}%\n            </span>\n          </div>\n          <span className=\"text-[9px] text-[var(--mu)] font-bold\">\n            {skillName}\n          </span>\n        </div>\n      </div>\n    );\n  }\n\n  return (\n    <div className=\"p-3.5 rounded-3xl border-2 border-emerald-500/30 bg-gradient-to-b from-[var(--sf)] via-emerald-50/20 to-[var(--sf)] dark:from-slate-800 dark:via-emerald-950/20 dark:to-slate-800 shadow-md space-y-2.5 relative overflow-hidden\">\n      {/* Background seal watermarks */}\n      <div className=\"absolute -right-6 -bottom-6 w-28 h-28 rounded-full border-8 border-emerald-500/10 pointer-events-none\" />\n      <div className=\"absolute -left-6 -top-6 w-20 h-20 rounded-full border-4 border-amber-500/10 pointer-events-none\" />\n\n      {/* Header Stamp */}\n      <div className=\"flex items-center justify-between\">\n        <div className=\"flex items-center gap-1.5 text-xs font-black text-emerald-700 dark:text-emerald-400\">\n          <ShieldCheck className=\"w-4 h-4 text-emerald-600 dark:text-emerald-400\" />\n          <span>{isAr ? '\u0634\u0627\u0631\u0629 HIRE ME \u0627\u0644\u0645\u0639\u062a\u0645\u062f\u0629' : 'Official Verified Badge'}</span>\n        </div>\n        <span className=\"text-[10px] font-mono font-bold text-[var(--mu)] px-2 py-0.5 rounded-md bg-[var(--bg)]\">\n          {badgeId}\n        </span>\n      </div>\n\n      {/* Central Visual Badge Seal */}\n      <div className=\"flex items-center gap-3 p-2.5 rounded-2xl bg-[var(--sf)]/90 border border-emerald-500/20 shadow-xs\">\n        {/* SVG Seal Icon */}\n        <div className=\"w-14 h-14 relative flex-shrink-0\">\n          <svg viewBox=\"0 0 100 100\" width=\"100%\" height=\"100%\">\n            {/* Outer Seal Teeth / Ring */}\n            <circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#0B6E70\" opacity=\"0.15\" />\n            <circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"none\" stroke=\"#0B6E70\" strokeWidth=\"2.5\" strokeDasharray=\"3 3\" />\n            <circle cx=\"50\" cy=\"50\" r=\"36\" fill=\"#17724A\" />\n            {/* Inner checkmark */}\n            <path\n              d=\"M36 50 L46 60 L66 38\"\n              fill=\"none\"\n              stroke=\"#FFFFFF\"\n              strokeWidth=\"6\"\n              strokeLinecap=\"round\"\n              strokeLinejoin=\"round\"\n            />\n            {/* Ribbon Banner at bottom */}\n            <rect x=\"22\" y=\"74\" width=\"56\" height=\"15\" rx=\"4\" fill=\"#F2A33A\" />\n            <text x=\"50\" y=\"85\" textAnchor=\"middle\" fontSize=\"9\" fontWeight=\"900\" fill=\"#FFFFFF\">\n              {score}% PASSED\n            </text>\n          </svg>\n        </div>\n\n        <div className=\"flex-1 text-start\">\n          <div className=\"flex items-center gap-1.5 flex-wrap\">\n            <h4 className=\"font-extrabold text-sm text-[var(--tx)]\">\n              {skillName}\n            </h4>\n            {isFastLearner && (\n              <span className=\"px-2 py-0.5 rounded-full bg-amber-500 text-white text-[10px] font-black flex items-center gap-1\">\n                <Award className=\"w-3 h-3\" />\n                {isAr ? '\u0633\u0631\u064a\u0639 \u0627\u0644\u062a\u0639\u0644\u0645' : 'Fast Learner'}\n              </span>\n            )}\n          </div>\n          <p className=\"text-[11px] text-[var(--mu)] font-semibold mt-0.5\">\n            {isAr\n              ? '\u0627\u062c\u062a\u0627\u0632 \u0627\u0644\u0641\u062d\u0635 \u0627\u0644\u0639\u0645\u0644\u064a \u0648\u0645\u0631\u0627\u0642\u0628\u0629 \u0627\u0644\u0646\u0632\u0627\u0647\u0629 \u0628\u0646\u062c\u0627\u062d'\n              : 'Passed practical skill test with proctoring'}\n          </p>\n          <div className=\"flex items-center gap-2 mt-1 text-[10px] text-emerald-700 dark:text-emerald-300 font-bold\">\n            <span>\u2713 {isAr ? '\u0645\u0648\u062b\u0642 \u0631\u0633\u0645\u064a\u0627\u064b' : 'Official Verification'}</span>\n            <span>\u2022</span>\n            <span>{isAr ? '\u062f\u0631\u062c\u0629 \u0627\u0644\u0625\u062a\u0642\u0627\u0646:' : 'Score:'} {score}%</span>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};\n\n\n// ===== src/CandidateBadge.tsx =====\n\n\n\ninterface CandidateBadgeProps {\n  score: number;\n  level?: string;\n  levelAr?: string;\n  badgeId?: string;\n  langIndex: number; // 0 = EN,
