Name=\"p-3 rounded-2xl bg-[var(--sf)] border border-[var(--ln)] text-center shadow-2xs\">\n                  <span className=\"text-[10px] font-bold text-[var(--mu)] block\">\n                    {langIndex === 1 ? '\u0625\u062c\u0645\u0627\u0644\u064a \u0627\u0644\u0645\u062a\u0642\u062f\u0645\u064a\u0646' : 'Verified Talent'}\n                  </span>\n                  <b className=\"text-lg font-black text-[var(--pri)]\">{CANDIDATES.length}</b>\n                </div>\n                <div className=\"p-3 rounded-2xl bg-[var(--sf)] border border-[var(--ln)] text-center shadow-2xs\">\n                  <span className=\"text-[10px] font-bold text-[var(--mu)] block\">\n                    {langIndex === 1 ? '\u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0627\u062a \u0627\u0644\u0645\u062c\u062f\u0648\u0644\u0629' : 'Interviews'}\n                  </span>\n                  <b className=\"text-lg font-black text-emerald-600\">{scheduledInterviews.length}</b>\n                </div>\n                <div className=\"p-3 rounded-2xl bg-[var(--sf)] border border-[var(--ln)] text-center shadow-2xs\">\n                  <span className=\"text-[10px] font-bold text-[var(--mu)] block\">\n                    {langIndex === 1 ? '\u0627\u0644\u0627\u0644\u062a\u0632\u0627\u0645 \u0628\u0627\u0644\u0631\u062f' : 'On-Time SLA'}\n                  </span>\n                  <b className=\"text-lg font-black text-amber-600\">100%</b>\n                </div>\n              </div>\n\n              {/* Tabs Switcher */}\n              <div className=\"flex rounded-2xl p-1 bg-[var(--bg)] border border-[var(--ln)]\">\n                <button\n                  onClick={() => {\n                    playClickSound();\n                    setEmployerTab('interviews');\n                  }}\n                  className={`flex-1 py-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition ${\n                    employerTab === 'interviews'\n                      ? 'bg-[var(--sf)] text-[var(--pri)] shadow-xs'\n                      : 'text-[var(--mu)] hover:text-[var(--tx)]'\n                  }`}\n                >\n                  <Calendar className=\"w-3.5 h-3.5\" />\n                  <span>\n                    {langIndex === 1 ? '\u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0627\u062a \u0627\u0644\u0645\u062c\u062f\u0648\u0644\u0629' : 'Interviews'} ({scheduledInterviews.length})\n                  </span>\n                </button>\n                <button\n                  onClick={() => {\n                    playClickSound();\n                    setEmployerTab('applicants');\n                  }}\n                  className={`flex-1 py-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition ${\n                    employerTab === 'applicants'\n                      ? 'bg-[var(--sf)] text-[var(--pri)] shadow-xs'\n                      : 'text-[var(--mu)] hover:text-[var(--tx)]'\n                  }`}\n                >\n                  <UserCheck className=\"w-3.5 h-3.5\" />\n                  <span>\n                    {langIndex === 1 ? '\u0627\u0644\u0645\u062a\u0642\u062f\u0645\u0648\u0646 \u0627\u0644\u0645\u0648\u062b\u0642\u0648\u0646' : 'Verified Talent'} ({CANDIDATES.length})\n                  </span>\n                </button>\n              </div>\n\n              {/* TAB 1: SCHEDULED INTERVIEWS */}\n              {employerTab === 'interviews' && (\n                <div className=\"space-y-3\">\n                  {scheduledInterviews.length === 0 ? (\n                    <div className=\"py-12 px-4 rounded-3xl border-2 border-dashed border-[var(--ln)] bg-[var(--sf)] text-center space-y-3\">\n                      <div className=\"w-12 h-12 rounded-full bg-[var(--okb)] text-[var(--pri)] mx-auto flex items-center justify-center\">\n                        <Calendar className=\"w-6 h-6\" />\n                      </div>\n                      <h4 className=\"font-extrabold text-sm text-[var(--tx)]\">\n                        {langIndex === 1 ? '\u0644\u0627 \u062a\u0648\u062c\u062f \u0645\u0642\u0627\u0628\u0644\u0627\u062a \u0645\u062c\u062f\u0648\u0644\u0629 \u062d\u062a\u0649 \u0627\u0644\u0622\u0646' : 'No scheduled interviews yet'}\n                      </h4>\n                      <p className=\"text-xs text-[var(--mu)] max-w-xs mx-auto leading-relaxed\">\n                        {langIndex === 1\n                          ? '\u062a\u0635\u0641\u062d \u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u0645\u0631\u0634\u062d\u064a\u0646 \u0627\u0644\u0645\u0648\u062b\u0642\u064a\u0646 \u0648\u0627\u0636\u063a\u0637 \u0639\u0644\u0649 \"\u0642\u0628\u0648\u0644 \u0648\u062f\u0639\u0648\u0629 \u0644\u0645\u0642\u0627\u0628\u0644\u0629\" \u0644\u062a\u0623\u0643\u064a\u062f \u0645\u0648\u0639\u062f \u0645\u0642\u0627\u0628\u0644\u0629 \u0641\u064a\u062f\u064a\u0648 \u0641\u0648\u0631\u064a\u0629.'\n                          : 'Browse the verified candidate pool and select candidates to schedule video interviews.'}\n                      </p>\n                      <button\n                        onClick={() => {\n                          playClickSound();\n                          setEmployerTab('applicants');\n                        }}\n                        className=\"px-4 py-2 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white text-xs font-extrabold transition shadow-xs\"\n                      >\n                        {langIndex === 1 ? '\u0627\u062e\u062a\u064a\u0627\u0631 \u0645\u0631\u0634\u062d\u064a\u0646 \u0644\u0644\u0645\u0642\u0627\u0628\u0644\u0629' : 'Select Candidates for Interview'}\n                      </button>\n                    </div>\n                  ) : (\n                    scheduledInterviews.map((iv, idx) => {\n                      const cand = CANDIDATES[iv.c];\n                      const slotText = SLOTS[iv.sl] ? L(SLOTS[iv.sl]) : '';\n                      return (\n                        <div\n                          key={idx}\n                          className=\"p-4 rounded-3xl border-2 border-emerald-300 dark:border-emerald-700/60 bg-[var(--sf)] space-y-3 shadow-xs\"\n                        >\n                          <div className=\"flex items-start justify-between gap-2\">\n                            <div className=\"flex items-center gap-3\">\n                              {renderAvatar(iv.c, 52)}\n                              <div>\n                                <div className=\"flex items-center gap-2\">\n                                  <h3 className=\"font-extrabold text-base text-[var(--tx)]\">\n                                    {L(cand.n)}\n                                  </h3>\n                                  <span className=\"px-2 py-0.5 rounded-full bg-[var(--okb)] text-[var(--ok)] text-[10px] font-black\">\n                                    {langIndex === 1 ? '\u0645\u0642\u0628\u0648\u0644 \u0648\u0645\u062c\u062f\u0648\u0644' : 'Accepted & Booked'}\n                                  </span>\n                                </div>\n                                <p className=\"text-xs text-[var(--mu)] font-bold mt-0.5\">\n                                  {cand.specialty ? L(cand.specialty) : cand.level}\n                                </p>\n                              </div>\n                            </div>\n                            {/* Candidate's Verified Badge right next to candidate! */}\n                            <CandidateBadge\n                              score={cand.sc}\n                              level={cand.level}\n                              levelAr={cand.levelAr}\n                              badgeId={cand.badgeId}\n                              langIndex={langIndex}\n                              variant=\"compact\"\n                            />\n                          </div>\n\n                          {/* Meeting details box */}\n                          <div className=\"p-3 rounded-2xl bg-[var(--bg)] border border-[var(--ln)] space-y-2 text-xs\">\n                            <div className=\"flex items-center justify-between font-bold text-[var(--tx)]\">\n                              <span className=\"flex items-center gap-1 text-[var(--pri)]\">\n                                <Calendar className=\"w-4 h-4\" />\n                                <span>{langIndex === 1 ? '\u0627\u0644\u0645\u0648\u0639\u062f \u0627\u0644\u0645\u0639\u062a\u0645\u062f:' : 'Confirmed Slot:'}</span>\n                              </span>\n                              <span className=\"font-extrabold\">{slotText}</span>\n                            </div>\n                            <div className=\"flex items-center justify-between text-[11px] text-[var(--mu)]\">\n                              <span className=\"flex items-center gap-1\">\n                                <Video className=\"w-3.5 h-3.5 text-emerald-600\" />\n                                <span>{langIndex === 1 ? '\u063a\u0631\u0641\u0629 \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0627\u0644\u0645\u0628\u0627\u0634\u0631\u0629:' : 'Meeting Room:'}</span>\n                              </span>\n                              <span className=\"font-mono text-emerald-700 dark:text-emerald-400 font-bold\">\n                                meet.hireme.app/{cand.badgeId.toLowerCase()}\n                              </span>\n                            </div>\n                            {cand.phone && (\n                              <div className=\"flex items-center justify-between text-[11px] text-[var(--mu)] pt-1 border-t border-[var(--ln)]/50\">\n                                <span>\ud83d\udcde {cand.phone}</span>\n                                <span>\u2709\ufe0f {cand.email}</span>\n                              </div>\n                            )}\n                          </div>\n\n                          {/* Action buttons */}\n                          <div className=\"flex gap-2\">\n                            <button\n                              onClick={() => {\n                                playClickSound();\n                                showToast(\n                                  langIndex === 1\n                                    ? '\u062c\u0627\u0631\u064a \u0641\u062a\u062d \u063a\u0631\u0641\u0629 \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629 \u0627\u0644\u0645\u0631\u0626\u064a\u0629 \u0627\u0644\u0645\u0628\u0627\u0634\u0631\u0629 \u0627\u0644\u0645\u0634\u0641\u0631\u0629'\n                                    : 'Opening encrypted video interview room'\n                                );\n                              }}\n                              className=\"flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-xs transition\"\n                            >\n                              <Video className=\"w-3.5 h-3.5\" />\n                              <span>{langIndex === 1 ? '\u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u0642\u0627\u0628\u0644\u0629' : 'Join Video'}</span>\n                            </button>\n                            <button\n                              onClick={() => {\n                                playClickSound();\n                                showToast(\n                                  langIndex === 1\n                                    ? `\u062a\u0645 \u0641\u062a\u062d \u0642\u0646\u0627\u0629 \u0627\u0644\u0645\u062d\u0627\u062f\u062b\u0629 \u0627\u0644\u0641\u0648\u0631\u064a\u0629 \u0645\u0639 ${L(cand.n)}`\n                                    : `Chat opened with ${L(cand.n)}`\n                                );\n                              }}\n                              className=\"px-3.5 py-2.5 rounded-xl border border-[var(--ln)] hover:border-[var(--pri)] text-xs font-bold flex items-center justify-center gap-1 transition\"\n                            >\n                              <MessageSquare className=\"w-3.5 h-3.5\" />\n                              <span>{langIndex === 1 ? '\u0645\u0631\u0627\u0633\u0644\u0629' : 'Chat'}</span>\n                            </button>\n                          </div>\n                        </div>\n                      );\n                    })\n                  )}\n                </div>\n              )}\n\n              {/* TAB 2: VERIFIED APPLICANTS TALENT POOL */}\n              {employerTab === 'applicants' && (\n                <div className=\"space-y-3\">\n                  {/* Filter chips for candidate pool */}\n                  <div className=\"flex flex-wrap items-center gap-1.5 pb-1\">\n                    {[\n                      { id: 'all', label: langIndex === 1 ? `\u0627\u0644\u0643\u0644 (${CANDIDATES.length})` : `All (${CANDIDATES.length})` },\n                      { id: 'top', label: langIndex === 1 ? '\u0623\u0639\u0644\u0649 \u062a\u0642\u064a\u064a\u0645 90%+' : 'Top 90%+' },\n                      { id: 'junior', label: langIndex === 1 ? '\u0645\u0628\u062a\u062f\u0626' : 'Junior' },\n                      { id: 'mid', label: langIndex === 1 ? '\u0645\u062a\u0648\u0633\u0637 / \u0645\u062a\u0642\u062f\u0645' : 'Mid / Senior' },\n                    ].map((f) => (\n                      <button\n                        key={f.id}\n                        onClick={() => {\n                          playClickSound();\n                          setEmployerFilter(f.id as any);\n                        }}\n                        className={`px-3 py-1 rounded-full text-xs font-bold transition ${\n                          employerFilter === f.id\n                            ? 'bg-[var(--pri)] text-white shadow-xs'\n                            : 'bg-[var(--sf)] border border-[var(--ln)] text-[var(--mu)] hover:border-[var(--pri)]'\n                        }`}\n                      >\n                        {f.label}\n                      </button>\n                    ))}\n                  </div>\n\n                  {/* Candidate items */}\n                  {CANDIDATES.filter((c) => {\n                    if (employerFilter === 'top') return c.sc >= 90;\n                    if (employerFilter === 'junior') return c.level.toLowerCase().includes('junior');\n                    if (employerFilter === 'mid') return !c.level.toLowerCase().includes('junior');\n                    return true;\n                  }).map((c, originalIdx) => {\n                    const isScheduled = scheduledInterviews.some((iv) => iv.c === originalIdx);\n                    const decision = employerDecisions[originalIdx];\n\n                    return (\n                      <div\n                        key={originalIdx}\n                        className=\"p-4 rounded-3xl border border-[var(--ln)] bg-[var(--sf)] hover:border-[var(--pri)] space-y-3 transition shadow-xs\"\n                      >\n                        {/* Candidate Header with Profile and Verified Badge */}\n                        <div className=\"flex items-start justify-between gap-2\">\n                          <div className=\"flex items-center gap-3\">\n                            {renderAvatar(originalIdx, 50)}\n                            <div>\n                              <div className=\"flex items-center gap-1.5 flex-wrap\">\n                                <h3 className=\"font-extrabold text-base text-[var(--tx)]\">\n                                  {L(c.n)}\n                                </h3>\n                                {c.f ? (\n                                  <span className=\"px-2 py-0.5 rounded-full bg-amber-500 text-white text-[10px] font-black\">\n                                    {t('fast')}\n                                  </span>\n                                ) : null}\n                              </div>\n                              <p className=\"text-xs text-[var(--mu)] font-bold mt-0.5\">\n                                {c.specialty ? L(c.specialty) : c.level}\n                              </p>\n                            </div>\n                          </div>\n\n                          {/* VERIFIED BADGE RIGHT BESIDE CANDIDATE */}\n                          <CandidateBadge\n                            score={c.sc}\n                            level={c.level}\n                            levelAr={c.levelAr}\n                            badgeId={c.badgeId}\n                            langIndex={langIndex}\n                            variant=\"compact\"\n                          />\n                        </div>\n\n                        {/* Experience and Skills Tags */}\n                        <div className=\"flex flex-wrap items-center gap-1.5 text-xs\">\n                          {c.experience && (\n                            <span className=\"px-2 py-0.5 rounded-md bg-[var(--bg)] text-[var(--mu)] font-semibold\">\n                              \ud83d\udcbc {L(c.experience)}\n                            </span>\n                          )}\n                          <span className=\"px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 font-bold\">\n                            \u2713 {langIndex === 1 ? '\u0641\u062d\u0635 \u0639\u0645\u0644\u064a \u0645\u0648\u062b\u0642' : 'Assessment'} {c.sc}%\n                          </span>\n                        </div>\n\n                        <div className=\"flex flex-wrap gap-1.5 pt-0.5\">\n                          {c.s.map((sk, skIdx) => (\n                            <span\n                              key={skIdx}\n                              className=\"px-2 py-0.5 rounded-lg bg-[var(--okb)] text-[var(--pri)] font-bold text-[11px]\"\n                            >\n                              {sk}\n                            </span>\n                          ))}\n                        </div>\n\n                        {/* Decision / Status Area */}\n                        <div className=\"pt-2 border-t border-[var(--ln)]\">\n                          {isScheduled || decision?.d === 'i' ? (\n                            <div className=\"p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-300 dark:border-emerald-700/60 text-emerald-800 dark:text-emerald-300 text-xs font-black flex items-center justify-between\">\n                              <span className=\"flex items-center gap-1.5\">\n                                <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n                                <span>\n                                  {langIndex === 1 ? '\u062a\u0645 \u0642\u0628\u0648\u0644 \u0627\u0644\u0645\u0631\u0634\u062d \u0648\u062a\u062d\u062f\u064a\u062f \u0645\u0642\u0627\u0628\u0644\u0629 \u0641\u064a\u062f\u064a\u0648' : 'Candidate Accepted & Interview Booked'}\n                                </span>\n                              </span>\n                              <button\n                                onClick={() => {\n                                  playClickSound();\n                                  setEmployerTab('interviews');\n                                }}\n                                className=\"underline text-xs font-extrabold hover:opacity-80\"\n                              >\n                                {langIndex === 1 ? '\u0639\u0631\u0636 \u0627\u0644\u0645\u0648\u0639\u062f' : 'View Slot'}\n                              </button>\n                            </div>\n                          ) : decision?.d === 'n' ? (\n                            <div className=\"p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-[var(--ln)] text-[var(--mu)] text-xs font-bold flex items-center justify-between\">\n                              <span>\n                                {langIndex === 1 ? '\u062a\u0645 \u0625\u0631\u0633\u0627\u0644 \u0627\u0639\u062a\u0630\u0627\u0631 \u0628\u0627\u062d\u062a\u0631\u0627\u0645 \u0645\u0639 \u0633\u0628\u0628 \u0627\u0644\u062a\u0648\u062c\u064a\u0647' : 'Politely declined with constructive reason'}\n                              </span>\n                              <span className=\"text-[10px] font-mono text-slate-400\">\n                                {decision.r ? t(decision.r) : ''}\n                              </span>\n                            </div>\n                          ) : (\n                            <div className=\"flex gap-2\">\n                              <button\n                                onClick={() => {\n                                  playClickSound();\n                                  setCandidateToSchedule(originalIdx);\n                                  setShowSlotPickerModal(true);\n                                }}\n                                className=\"flex-1 py-2 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white font-extrabold text-xs shadow-xs transition active:scale-98 flex items-center justify-center gap-1.5\"\n                              >\n                                <CheckCircle2 className=\"w-3.5 h-3.5\" />\n                                <span>{langIndex === 1 ? '\u0642\u0628\u0648\u0644 \u0648\u062f\u0639\u0648\u0629 \u0644\u0645\u0642\u0627\u0628\u0644\u0629' : 'Accept & Interview'}</span>\n                              </button>\n                              <button\n                                onClick={() => {\n                                  playClickSound();\n                                  setApplicantSelectedForDecision(originalIdx);\n                                  setShowDecisionModal(true);\n                                }}\n                                className=\"px-3.5 py-2 rounded-xl border border-[var(--ln)] hover:border-[var(--er)] text-[var(--mu)] hover:text-[var(--er)] font-bold text-xs transition active:scale-98\"\n                              >\n                                {langIndex === 1 ? '\u0627\u0639\u062a\u0630\u0627\u0631 \u0628\u0627\u062d\u062a\u0631\u0627\u0645' : 'Polite Decline'}\n                              </button>\n                            </div>\n                          )}\n                        </div>\n                      </div>\n                    );\n                  })}\n                </div>\n              )}\n            </div>\n          )}\n\n          {/* 13. CANDIDATE: APPLICATION STATUS TRACK */}\n          {scr === 'app' && (\n            <div className=\"space-y-4 animate-up pt-1\">\n              <button\n                onClick={() => setScr('apps')}\n                className=\"text-xs text-[var(--mu)] font-bold flex items-center gap-1 hover:text-[var(--tx)]\"\n              >\n                {langIndex === 1 ? <ArrowRight className=\"w-3.5 h-3.5\" /> : <ArrowLeft className=\"w-3.5 h-3.5\" />}\n                {t('tApps')}\n              </button>\n\n              {(() => {\n                const app = applications[currentAppIndex];\n                if (!app) return null;\n                const j = INITIAL_JOBS[app.j];\n                const stages = ['s1', 's2', 's3', 's6', 's4'];\n\n                return (\n                  <div className=\"space-y-4\">\n                    <div>\n                      <h1 className=\"text-2xl font-black\">{L(j.t)}</h1>\n                      <p className=\"text-xs text-[var(--mu)] font-bold\">{j.co}</p>\n                    </div>\n\n                    <div className=\"p-3 rounded-xl bg-[var(--wn)] text-xs text-[var(--tx)] font-bold flex items-center gap-2\">\n                      <Clock className=\"w-4 h-4 text-[var(--acc)]\" />\n                      <span>{t('due')}</span>\n                    </div>\n\n                    {/* Stepper */}\n                    <div className=\"space-y-4 ps-2 py-2\">\n                      {stages.map((stKey, idx) => {\n                        const isDone = idx < app.st;\n                        const isNow = idx === app.st;\n                        return (\n                          <div key={idx} className=\"flex items-center gap-3 relative\">\n                            <div\n                              className={`w-7 h-7 rounded-full border-2 flex items-center justify-center text-xs font-black z-10 ${\n                                isDone\n                                  ? 'border-[var(--ok)] bg-[var(--ok)] text-white'\n                                  : isNow\n                                  ? 'border-[var(--pri)] bg-[var(--sf)] text-[var(--pri)] ring-4 ring-[var(--okb)]'\n                                  : 'border-[var(--ln)] bg-[var(--sf)] text-[var(--mu)]'\n                              }`}\n                            >\n                              {isDone ? '\u2713' : idx + 1}\n                            </div>\n                            <span\n                              className={`text-xs font-extrabold ${\n                                isNow ? 'text-[var(--pri)]' : isDone ? 'text-[var(--tx)]' : 'text-[var(--mu)]'\n                              }`}\n                            >\n                              {t(stKey)}\n                            </span>\n                          </div>\n                        );\n                      })}\n                    </div>\n\n                    {/* Interview Simulator for Stage 3 (Interview Scheduled) */}\n                    {app.st === 3 && (\n                      <div className=\"pt-2\">\n                        <InterviewSimulator langIndex={langIndex} />\n                      </div>\n                    )}\n\n                    {/* Feedback prompt if interview passed */}\n                    {app.st >= 3 && (\n                      <div className=\"p-4 rounded-2xl bg-[var(--okb)]/70 space-y-2\">\n                        {app.fb ? (\n                          <div className=\"flex items-center gap-2 text-xs font-extrabold text-[var(--ok)]\">\n                            <CheckCircle2 className=\"w-4 h-4\" />\n                            <span>{t('fb_done')}</span>\n                          </div>\n                        ) : (\n                          <>\n                            <h4 className=\"font-extrabold text-xs\">{t('fb_t')}</h4>\n                            <p className=\"text-[11px] text-[var(--mu)]\">{t('fb_p')}</p>\n                            <button\n                              onClick={() => {\n                                setFbQ1(null);\n                                setFbQ2(null);\n                                setScr('fb');\n                              }}\n                              className=\"w-full py-2.5 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white font-bold text-xs\"\n                            >\n                              {t('fb_btn')}\n                            </button>\n                          </>\n                        )}\n                      </div>\n                    )}\n\n                    <div className=\"space-y-2 pt-2\">\n                      <button className=\"w-full h-11 rounded-xl border border-[var(--ln)] font-bold text-xs hover:bg-[var(--okb)]\">\n                        {t('msg')}\n                      </button>\n\n                      {/* Demo advance button */}\n                      <button\n                        onClick={() => {\n                          if (app.st < 4) {\n                            const newApps = [...applications];\n                            newApps[currentAppIndex].st += 1;\n                            setApplications(newApps);\n                          }\n                        }}\n                        className=\"w-full h-9 rounded-xl border border-dashed border-[var(--mu)] text-xs text-[var(--mu)]\"\n                      >\n                        {t('adv')}\n                      </button>\n                    </div>\n                  </div>\n                );\n              })()}\n            </div>\n          )}\n\n          {/* 13.5 CANDIDATE: EDUCATIONAL PARTNERS & ACCREDITED COURSES */}\n          {scr === 'partners' && (\n            <div className=\"space-y-4 animate-up pt-1\">\n              <div className=\"flex items-center justify-between\">\n                <button\n                  onClick={() => setScr('jobs')}\n                  className=\"text-xs text-[var(--mu)] font-bold flex items-center gap-1 hover:text-[var(--tx)]\"\n                >\n                  {langIndex === 1 ? <ArrowRight className=\"w-3.5 h-3.5\" /> : <ArrowLeft className=\"w-3.5 h-3.5\" />}\n                  {t('tJobs')}\n                </button>\n                <span className=\"px-2.5 py-0.5 rounded-full bg-[var(--okb)] text-[var(--pri)] text-xs font-black\">\n                  {langIndex === 1 ? '\u062e\u0635\u0648\u0645\u0627\u062a \u062a\u0635\u0644 \u0644\u0640 65%' : 'Up to 65% OFF'}\n                </span>\n              </div>\n\n              <div>\n                <h1 className=\"text-2xl font-black text-[var(--tx)]\">\n                  {langIndex === 1 ? '\u0623\u0643\u0627\u062f\u064a\u0645\u064a\u0627\u062a \u0648\u0634\u0631\u0643\u0627\u0621 \u0627\u0644\u062a\u0639\u0644\u064a\u0645 \u0627\u0644\u0645\u0639\u062a\u0645\u062f\u0648\u0646' : 'Accredited Learning Partners'}\n                </h1>\n                <p className=\"text-xs text-[var(--mu)] leading-relaxed mt-1\">\n                  {langIndex === 1\n                    ? '\u0645\u0633\u0627\u0631\u0627\u062a \u062a\u062f\u0631\u064a\u0628\u064a\u0629 \u0648\u0634\u0631\u0627\u0643\u0627\u062a \u062d\u0635\u0631\u064a\u0629 \u0645\u0639 \u0643\u0628\u0631\u0649 \u0645\u0646\u0635\u0627\u062a \u0627\u0644\u062a\u0639\u0644\u064a\u0645 \u0627\u0644\u0639\u0627\u0644\u0645\u064a\u0629 \u0648\u0627\u0644\u0625\u0642\u0644\u064a\u0645\u064a\u0629 \u0644\u0627\u0643\u062a\u0633\u0627\u0628 \u0648\u062a\u0648\u062b\u064a\u0642 \u0645\u0647\u0627\u0631\u0627\u062a \u0633\u0648\u0642 \u0627\u0644\u0639\u0645\u0644 \u0641\u064a Hire Me.'\n                    : 'Exclusive partnerships with leading global & regional platforms to master workplace skills and boost your hireability.'}\n                </p>\n              </div>\n\n              <EducationalPartnersSection langIndex={langIndex} />\n            </div>\n          )}\n\n          {/* 14. CANDIDATE: PROFILE */}\n          {scr === 'profile' && (\n            <div className=\"space-y-4 animate-up pt-1\">\n              <button\n                onClick={() => setScr('jobs')}\n                className=\"text-xs text-[var(--mu)] font-bold flex items-center gap-1 hover:text-[var(--tx)]\"\n              >\n                {langIndex === 1 ? <ArrowRight className=\"w-3.5 h-3.5\" /> : <ArrowLeft className=\"w-3.5 h-3.5\" />}\n                {langIndex === 1 ? '\u0627\u0644\u0631\u062c\u0648\u0639 \u0644\u0644\u0648\u0638\u0627\u0626\u0641' : 'Back to Jobs'}\n              </button>\n              <ProfileTab langIndex={langIndex} answers={answers} />\n            </div>\n          )}\n\n          {/* 14. CANDIDATE: INTERVIEW FEEDBACK */}\n          {scr === 'fb' && (\n            <div className=\"space-y-4 animate-up pt-1\">\n              <h1 className=\"text-xl font-black\">{t('fb_t')}</h1>\n              <p className=\"text-xs text-[var(--mu)]\">{t('fb_p')}</p>\n\n              <div className=\"space-y-3 pt-2\">\n                <h3 className=\"font-extrabold text-xs\">{t('a1')}</h3>\n                <div className=\"flex flex-wrap gap-2\">\n                  {[\n                    ['y', 'a1y'],\n                    ['p', 'a1p'],\n                    ['n', 'a1n'],\n                  ].map(([key, labelKey]) => (\n                    <button\n                      key={key}\n                      onClick={() => setFbQ1(key)}\n                      className={`px-3 py-2 rounded-xl border-2 text-xs font-bold transition ${\n                        fbQ1 === key ? 'border-[var(--pri)] bg-[var(--okb)]' : 'border-[var(--ln)]'\n                      }`}\n                    >\n                      {t(labelKey)}\n                    </button>\n                  ))}\n                </div>\n\n                <h3 className=\"font-extrabold text-xs pt-2\">{t('a2')}</h3>\n                <div className=\"flex flex-wrap gap-2\">\n                  {[\n                    ['r', 'a2r'],\n                    ['h', 'a2h'],\n                    ['e', 'a2e'],\n                  ].map(([key, labelKey]) => (\n                    <button\n                      key={key}\n                      onClick={() => setFbQ2(key)}\n                      className={`px-3 py-2 rounded-xl border-2 text-xs font-bold transition ${\n                        fbQ2 === key ? 'border-[var(--pri)] bg-[var(--okb)]' : 'border-[var(--ln)]'\n                      }`}\n                    >\n                      {t(labelKey)}\n                    </button>\n                  ))}\n                </div>\n              </div>\n\n              <div className=\"space-y-2 pt-4\">\n                <button\n                  disabled={!fbQ1 || !fbQ2}\n                  onClick={() => {\n                    const newApps = [...applications];\n                    newApps[currentAppIndex].fb = true;\n                    setApplications(newApps);\n                    setScr('app');\n                    showToast(t('fb_ok'));\n                  }}\n                  className=\"w-full h-12 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] disabled:bg-[var(--ln)] text-white font-extrabold text-sm\"\n                >\n                  {t('sub')}\n                </button>\n                <button\n                  onClick={() => setScr('app')}\n                  className=\"w-full h-10 rounded-xl border border-[var(--ln)] text-xs text-[var(--mu)] font-bold\"\n                >\n                  {t('cancel')}\n                </button>\n              </div>\n            </div>\n          )}\n\n          {/* 15. EMPLOYER: ONBOARDING */}\n          {scr === 'onb' && (\n            <div className=\"space-y-4 animate-up pt-4 text-center\">\n              <div className=\"w-24 h-24 rounded-full border-4 border-[var(--pri)] bg-[var(--okb)] flex items-center justify-center mx-auto text-3xl font-black text-[var(--pri)] shadow-md\">\n                {['\u25ce', '\u25d0', '\u2709'][employerOnboardingStep]}\n              </div>\n\n              <h1 className=\"text-2xl font-black\">{t(`ob${employerOnboardingStep + 1}t`)}</h1>\n              <p className=\"text-xs text-[var(--mu)] leading-relaxed max-w-xs mx-auto\">\n                {t(`ob${employerOnboardingStep + 1}p`)}\n              </p>\n\n              {/* Dots */}\n              <div className=\"flex justify-center gap-1.5 pt-2\">\n                {[0, 1, 2].map((idx) => (\n                  <div\n                    key={idx}\n                    className={`h-2 rounded-full transition-all ${\n                      idx === employerOnboardingStep ? 'w-6 bg-[var(--pri)]' : 'w-2 bg-[var(--ln)]'\n                    }`}\n                  />\n                ))}\n              </div>\n\n              <div className=\"space-y-2 pt-6\">\n                {employerOnboardingStep < 2 ? (\n                  <>\n                    <button\n                      onClick={() => setEmployerOnboardingStep((s) => s + 1)}\n                      className=\"w-full h-12 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white font-extrabold text-sm shadow-md\"\n                    >\n                      {t('next')}\n                    </button>\n                    <button\n                      onClick={() => setScr('post')}\n                      className=\"w-full h-10 text-xs text-[var(--mu)] font-bold\"\n                    >\n                      {t('skip')}\n                    </button>\n                  </>\n                ) : (\n                  <button\n                    onClick={() => setScr('post')}\n                    className=\"w-full h-12 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white font-extrabold text-sm shadow-md\"\n                  >\n                    {t('start')}\n                  </button>\n                )}\n              </div>\n            </div>\n          )}\n\n          {/* 16. EMPLOYER: POST A JOB */}\n          {scr === 'post' && (\n            <div className=\"space-y-4 animate-up pt-1\">\n              <h1 className=\"text-2xl font-black\">{t('pt')}</h1>\n              <p className=\"text-xs text-[var(--mu)] leading-relaxed\">{t('pp')}</p>\n\n              <div className=\"space-y-3 pt-2\">\n                {/* Title */}\n                <div>\n                  <label className=\"block text-xs font-bold mb-1\">{t('jt')}</label>\n                  <input\n                    type=\"text\"\n                    value={jobForm.title}\n                    onChange={(e) => setJobForm({ ...jobForm, title: e.target.value })}\n                    placeholder={t('jph')}\n                    className=\"w-full h-11 px-3 rounded-xl border-2 border-[var(--ln)] bg-[var(--sf)] text-xs font-semibold\"\n                  />\n                  {jobFormErrors.t && <p className=\"text-xs text-[var(--er)] mt-1\">{jobFormErrors.t}</p>}\n                </div>\n\n                {/* Skill */}\n                <div>\n                  <label className=\"block text-xs font-bold mb-1\">{t('sk')}</label>\n                  <div className=\"flex items-center gap-2\">\n                    <span className=\"px-3 py-1.5 rounded-xl bg-[var(--okb)] text-[var(--pri)] font-black text-xs\">\n                      Excel\n                    </span>\n                    <span className=\"text-[11px] text-[var(--mu)]\">\n                      {langIndex === 1 ? '(\u0645\u0647\u0627\u0631\u0629 \u0623\u0633\u0627\u0633\u064a\u0629 \u0645\u0648\u062b\u0642\u0629)' : '(Primary Verified Skill)'}\n                    </span>\n                  </div>\n                </div>\n\n                {/* Level */}\n                <div>\n                  <label className=\"block text-xs font-bold mb-1\">{t('lvl')}</label>\n                  <div className=\"flex gap-2\">\n                    {['jr', 'md', 'sr'].map((k, i) => (\n                      <button\n                        key={k}\n                        type=\"button\"\n                        onClick={() => setJobForm({ ...jobForm, level: i })}\n                        className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold transition ${\n                          jobForm.level === i\n                            ? 'border-[var(--pri)] bg-[var(--okb)] text-[var(--pri)]'\n                            : 'border-[var(--ln)]'\n                        }`}\n                      >\n                        {t(k)}\n                      </button>\n                    ))}\n                  </div>\n                </div>\n\n                {/* Salary */}\n                <div>\n                  <label className=\"block text-xs font-bold mb-1\">{t('sal')}</label>\n                  <div className=\"flex gap-2\">\n                    <input\n                      type=\"number\"\n                      placeholder={t('min')}\n                      value={jobForm.salaryMin}\n                      onChange={(e) => setJobForm({ ...jobForm, salaryMin: e.target.value })}\n                      className=\"w-1/2 h-11 px-3 rounded-xl border-2 border-[var(--ln)] bg-[var(--sf)] text-xs\"\n                    />\n                    <input\n                      type=\"number\"\n                      placeholder={t('max')}\n                      value={jobForm.salaryMax}\n                      onChange={(e) => setJobForm({ ...jobForm, salaryMax: e.target.value })}\n                      className=\"w-1/2 h-11 px-3 rounded-xl border-2 border-[var(--ln)] bg-[var(--sf)] text-xs\"\n                    />\n                  </div>\n                  {jobFormErrors.s && <p className=\"text-xs text-[var(--er)] mt-1\">{jobFormErrors.s}</p>}\n                </div>\n\n                {/* Experience */}\n                <div>\n                  <label className=\"block text-xs font-bold mb-1\">{t('exp')}</label>\n                  <div className=\"flex gap-2\">\n                    {['e0', 'e1', 'e3'].map((k, i) => (\n                      <button\n                        key={k}\n                        type=\"button\"\n                        onClick={() => setJobForm({ ...jobForm, exp: i })}\n                        className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold transition ${\n                          jobForm.exp === i\n                            ? 'border-[var(--pri)] bg-[var(--okb)] text-[var(--pri)]'\n                            : 'border-[var(--ln)]'\n                        }`}\n                      >\n                        {t(k)}\n                      </button>\n                    ))}\n                  </div>\n                </div>\n\n                {/* Reply By Commitment */}\n                <div>\n                  <label className=\"block text-xs font-bold mb-1\">{t('rb')}</label>\n                  <div className=\"flex gap-2\">\n                    {[3, 5, 7].map((num) => (\n                      <button\n                        key={num}\n                        type=\"button\"\n                        onClick={() => setJobForm({ ...jobForm, days: num })}\n                        className={`flex-1 py-2 rounded-xl border-2 text-xs font-bold transition ${\n                          jobForm.days === num\n                            ? 'border-[var(--pri)] bg-[var(--okb)] text-[var(--pri)]'\n                            : 'border-[var(--ln)]'\n                        }`}\n                      >\n                        {num} {t('d')}\n                      </button>\n                    ))}\n                  </div>\n                </div>\n\n                {/* Presentation Switch */}\n                <div\n                  onClick={() => setJobForm({ ...jobForm, presentationReq: !jobForm.presentationReq })}\n                  className=\"p-3 rounded-xl border border-[var(--ln)] bg-[var(--sf)] flex items-center justify-between cursor-pointer\"\n                >\n                  <span className=\"text-xs font-bold\">{t('pres')}</span>\n                  <div\n                    className={`w-10 h-5 rounded-full transition-colors relative flex items-center p-0.5 ${\n                      jobForm.presentationReq ? 'bg-[var(--pri)]' : 'bg-[var(--ln)]'\n                    }`}\n                  >\n                    <div\n                      className={`w-4 h-4 rounded-full bg-white shadow-sm transform transition-transform ${\n                        jobForm.presentationReq\n                          ? langIndex === 1\n                            ? '-translate-x-5'\n                            : 'translate-x-5'\n                          : 'translate-x-0'\n                      }`}\n                    />\n                  </div>\n                </div>\n\n                {jobForm.presentationReq && (\n                  <div>\n                    <label className=\"block text-xs font-bold mb-1\">{t('why')}</label>\n                    <input\n                      type=\"text\"\n                      placeholder={t('whyph')}\n                      value={jobForm.presentationWhy}\n                      onChange={(e) => setJobForm({ ...jobForm, presentationWhy: e.target.value })}\n                      className=\"w-full h-11 px-3 rounded-xl border-2 border-[var(--ln)] bg-[var(--sf)] text-xs\"\n                    />\n                    {jobFormErrors.w && <p className=\"text-xs text-[var(--er)] mt-1\">{jobFormErrors.w}</p>}\n                  </div>\n                )}\n              </div>\n\n              <div className=\"pt-3\">\n                <button\n                  onClick={handlePublishJob}\n                  className=\"w-full h-12 rounded-xl bg-[var(--pri)] hover:bg-[var(--pri-hover)] text-white font-ex
