<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hire_Me</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --text:#1c2333; --muted:#66708a; --border:#e3e8f1;
  --primary:#3b5bdb; --primary-dark:#2f49b3; --primary-soft:#e9edff;
  --ok:#2b9348; --ok-soft:#e3f6e8; --warn:#e8890c; --warn-soft:#fff2df; --bad:#d6336c; --bad-soft:#fde7ef;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 4px 14px rgba(20,30,60,.06);
  --shadow-hover:0 8px 26px rgba(20,30,60,.12);
}
[data-theme="dark"]{
  --bg:#0f1422; --surface:#182033; --text:#e8ecf7; --muted:#9aa5c2; --border:#27314a;
  --primary:#7b93ff; --primary-dark:#6079f0; --primary-soft:#222c52;
  --ok:#57d27a; --ok-soft:#173526; --warn:#ffb454; --warn-soft:#3a2b14; --bad:#ff7aa8; --bad-soft:#3b1a29;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-hover:0 8px 26px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}

/* Header */
.header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:900;color:var(--primary);letter-spacing:.3px}
.nav{display:flex;gap:6px}
.nav a{padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.2s}
.nav a:hover{color:var(--primary);background:var(--primary-soft)}
.nav a.active{color:var(--primary);background:var(--primary-soft)}
.controls{display:flex;gap:10px;align-items:center}
.select,.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;font-size:16px}
.btn{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.ghost:hover{background:var(--primary);color:#fff}
.btn.danger{background:var(--bad);color:#fff}

/* Layout */
.container{max-width:920px;margin:0 auto;padding:28px 20px 60px}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{margin-bottom:20px}
.hero h1{font-size:26px;font-weight:900;margin-bottom:6px}
.hero p{color:var(--muted);font-size:15px}

/* Filters */
.filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.filters input{flex:1;min-width:200px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 14px;outline:none}
.count{color:var(--muted);font-size:13px;margin-bottom:12px}

/* Job cards */
.job-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;
  box-shadow:var(--shadow);transition:.2s;display:flex;gap:16px}
.job-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.avatar{width:52px;height:52px;border-radius:12px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-weight:900;font-size:20px;flex-shrink:0}
.job-body{flex:1;min-width:0}
.job-title{font-size:18px;font-weight:800;margin-bottom:3px}
.job-company{font-size:14px;color:var(--muted);margin-bottom:10px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{background:var(--primary-soft);color:var(--primary);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.job-desc{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:14px}
.job-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px}
.job-date{font-size:12px;color:var(--muted)}
.skeleton{height:130px;border-radius:14px;margin-bottom:14px;background:linear-gradient(90deg,var(--surface) 25%,var(--border) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:20px;margin-bottom:6px}
.panel .sub{color:var(--muted);font-size:14px;margin-bottom:16px;line-height:1.7}
.drop{border:2px dashed var(--primary);background:var(--primary-soft);border-radius:12px;padding:18px;text-align:center;margin-bottom:12px}
textarea,input[type="email"],input[type="password"]{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:12px;outline:none;line-height:1.7;margin-bottom:12px}
label.l{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.success{color:var(--ok);font-size:13px;margin-top:8px;min-height:18px}

/* Result */
.score-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:conic-gradient(var(--c,var(--primary)) calc(var(--p)*1%),var(--border) 0)}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-size:30px;line-height:1}
.ring small{color:var(--muted);font-size:12px}
.verdict h3{font-size:19px;margin-bottom:4px}
.verdict p{color:var(--muted);font-size:14px;line-height:1.7}
.checks{list-style:none;margin-top:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;line-height:1.6}
.checks li.ok{background:var(--ok-soft)}
.checks li.warn{background:var(--warn-soft)}
.checks li.bad{background:var(--bad-soft)}
.checks .pts{margin-inline-start:auto;font-weight:800;font-size:12px;white-space:nowrap;opacity:.8}
.kw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kw span{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.kw .miss{background:var(--bad-soft);color:var(--bad)}
.kw .hit{background:var(--ok-soft);color:var(--ok)}
.result{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.status-line{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
.toast{position:fixed;bottom:24px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--text);color:var(--bg);
  padding:12px 20px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;transform:translateY(10px)}
.toast.show{opacity:1;transform:none}
@media(max-width:600px){.header{padding:10px 14px}.job-card{flex-direction:column}.nav a{padding:7px 10px;font-size:13px}}
</style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
    <div class="brand">Hire_Me</div>
    <nav class="nav">
      <a id="navExplore" class="active" onclick="switchView('explore')" data-i18n="navExplore"></a>
      <a id="navCv" onclick="switchView('cv')" data-i18n="navCv"></a>
      <a id="navAuth" onclick="switchView('auth')" data-i18n="navAuth">تسجيل / دخول</a>
      <a id="navSettings" onclick="switchView('settings')" data-i18n="navSettings"></a>
    </nav>
  </div>
  <div class="controls">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Theme">🌙</button>
    <select id="langSelector" class="select" onchange="changeLanguage(this.value)">
      <option value="ar">العربية</option>
      <option value="en">English</option>
    </select>
    <button class="btn" id="headerCtaBtn" onclick="switchView('auth')" data-i18n="ctaLogin">تسجيل الدخول</button>
  </div>
</header>

<main class="container">

  <!-- Explore -->
  <section id="view-explore" class="view active">
    <div class="hero">
      <h1 data-i18n="exploreHeading"></h1>
      <p data-i18n="exploreSub"></p>
    </div>
    <div class="filters">
      <input id="searchInput" oninput="applyFilters()" data-i18n-ph="searchPh">
      <select id="typeFilter" class="select" onchange="applyFilters()"></select>
    </div>
    <div class="count" id="jobsCount"></div>
    <div id="jobs-container"></div>
  </section>

  <!-- CV Review -->
  <section id="view-cv" class="view">
    <div class="panel">
      <h2 data-i18n="cvHeading"></h2>
      <p class="sub" data-i18n="cvDesc"></p>

      <div class="drop">
        <div data-i18n="uploadLabel"></div>
        <input type="file" id="cvFile" accept=".pdf,.docx,.txt" onchange="handleFile(this.files[0])">
        <div class="hint" data-i18n="uploadHint"></div>
      </div>
      <textarea id="cvText" rows="8" data-i18n-ph="cvPh"></textarea>

      <label class="l" data-i18n="jdLabel"></label>
      <textarea id="jdText" rows="4" data-i18n-ph="jdPh"></textarea>
      <div class="hint" data-i18n="jdHint"></div>

      <div class="row">
        <button class="btn" id="analyzeBtn" onclick="runReview()" data-i18n="analyzeBtn"></button>
      </div>
      <div class="err" id="cvErr"></div>
    </div>

    <div class="result" id="result">
      <div class="panel">
        <div class="score-wrap">
          <div class="ring" id="ring"><div><span><b id="scoreNum">0</b><br><small>/ 100</small></span></div></div>
          <div class="verdict"><h3 id="verdictTitle"></h3><p id="verdictText"></p></div>
        </div>
      </div>
      <div class="panel">
        <h2 data-i18n="detailsTitle"></h2>
        <ul class="checks" id="checksList"></ul>
      </div>
      <div class="panel" id="matchPanel" style="display:none">
        <h2 data-i18n="matchTitle"></h2>
        <p class="sub" id="matchSummary"></p>
        <b style="font-size:14px" data-i18n="missingKw"></b>
        <div class="kw" id="missingKw"></div>
        <b style="font-size:14px;display:block;margin-top:14px" data-i18n="foundKw"></b>
        <div class="kw" id="foundKw"></div>
      </div>
      <div class="row">
        <button class="btn ghost" onclick="downloadReport()" data-i18n="downloadBtn"></button>
      </div>
    </div>
  </section>

  <!-- Auth View (Sign Up / Sign In) -->
  <section id="view-auth" class="view">
    <div class="panel" style="max-width: 450px; margin: 0 auto;">
      <h2 id="authTitle" data-i18n="authLoginTitle">تسجيل الدخول إلى حسابك</h2>
      <p class="sub" id="authSub" data-i18n="authLoginSub">أدخل بريدك الإلكتروني وكلمة المرور للمتابعة.</p>
      
      <div id="userLoggedBox" style="display:none;">
        <p style="margin-bottom: 12px;" data-i18n="loggedInAs">أنت مسجل الدخول حالياً بريد:</p>
        <b id="userEmailDisplay" style="color:var(--primary); display:block; margin-bottom:16px;"></b>
        <button class="btn danger" onclick="handleSignOut()" data-i18n="signOutBtn">تسجيل الخروج</button>
      </div>

      <div id="authFormBox">
        <label class="l" data-i18n="emailLabel">البريد الإلكتروني</label>
        <input type="email" id="authEmail" placeholder="name@example.com">

        <label class="l" data-i18n="passLabel">كلمة المرور</label>
        <input type="password" id="authPass" placeholder="••••••••">

        <div class="row" style="margin-top:10px;">
          <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()" data-i18n="loginBtn">دخول</button>
          <button class="btn ghost" onclick="toggleAuthMode()" id="authSwitchModeBtn" data-i18n="switchToSignup">إنشاء حساب جديد؟</button>
        </div>
        <div class="err" id="authErr"></div>
        <div class="success" id="authSuccess"></div>
      </div>
    </div>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view">
    <div class="panel">
      <h2 data-i18n="setHeading"></h2>
      <p class="sub" data-i18n="setDesc"></p>
      <div class="status-line"><span class="dot" id="dbDot"></span><span id="dbStatus"></span></div>
      <div class="status-line"><span class="dot on"></span><span data-i18n="setCv"></span></div>
    </div>
  </section>

</main>
<div class="toast" id="toast"></div>

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
  const target = document.getElementById('view-'+name);

/* ============ AUTHENTICATION SYSTEM ============ */
async function checkUserSession(){
  if(!supabaseClient) return;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session && session.user){
      showLoggedInState(session.user.email);
    } else {
      showLoggedOutState();
    }
  } catch(e){ showLoggedOutState(); }
}

function toggleAuthMode(){
  isSignUpMode = !isSignUpMode;
  const t = T[currentLang];
  document.getElementById('authTitle').textContent = isSignUpMode ? t.authSignupTitle : t.authLoginTitle;
  document.getElementById('authSub').textContent = isSignUpMode ? t.authSignupSub : t.authLoginSub;
  document.getElementById('authSubmitBtn').textContent = isSignUpMode ? t.signupBtn : t.loginBtn;
  document.getElementById('authSwitchModeBtn').textContent = isSignUpMode ? t.switchToLogin : t.switchToSignup;
  document.getElementById('authErr').textContent = '';
  document.getElementById('authSuccess').textContent = '';
}

async function handleAuthSubmit(){
  const t = T[currentLang];
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value.trim();
  const errEl = document.getElementById('authErr');
  const succEl = document.getElementById('authSuccess');
  
  errEl.textContent = '';
  succEl.textContent = '';

  if(!email || !password){
    errEl.textContent = currentLang==='ar' ? 'الرجاء إدخال البريد وكلمة المرور' : 'Please enter email and password';
    return;
  }

  if(!supabaseClient){
    errEl.textContent = 'Supabase client not initialized.';
    return;
  }

  try {
    if(isSignUpMode){
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if(error) throw error;
      succEl.textContent = currentLang==='ar' ? 'تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.' : 'Account created successfully! You can now sign in.';
      toast(currentLang==='ar' ? 'تم إنشاء الحساب بنجاح' : 'Account created successfully');
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
      showLoggedInState(email);
      toast(currentLang==='ar' ? 'مرحباً بك مجدداً!' : 'Welcome back!');
      setTimeout(()=>switchView('explore'), 1000);
    }
  } catch(e){
    errEl.textContent = e.message;
  }
}

async function handleSignOut(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  showLoggedOutState();
  toast(currentLang==='ar' ? 'تم تسجيل الخروج' : 'Signed out');
}

  document.getElementById('userEmailDisplay').textContent = email;

function renderJobs(list){

    const title=(en&&j.title_en)||j.title||'-';

/* ============ FILE READING ============ */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

async function handleFile(file){
  if(!file) return;
  const t=T[currentLang], err=document.getElementById('cvErr');
  if(err) err.textContent=t.reading;
  try{
    const ext=file.name.split('.').pop().toLowerCase();
    let text='';
    if(ext==='txt'){ text=await file.text(); }
    else if(ext==='docx'){
      if(!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
      text=r.value;
    } else if(ext==='pdf'){
      if(!window.pdfjsLib){
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      for(let p=1;p<=pdf.numPages;p++){
        const pg=await pdf.getPage(p); const c=await pg.getTextContent();
        text+=c.items.map(i=>i.str).join(' ')+'\n';
      }
    } else { throw new Error('type'); }
    const cvTextEl = document.getElementById('cvText');
    if(cvTextEl) cvTextEl.value=text.trim();
    if(err) err.textContent='';
  }catch(e){ if(err) err.textContent=t.readErr; }
}

/* ============ CV ANALYZER ============ */
const RX={
  email:/[\w.+-]+@[\w-]+\.[\w.-]+/,
  phone:/(\+?\d[\d\s().-]{8,}\d)/,
  link:/(linkedin\.com|github\.com|behance\.net|portfolio|https?:\/\/)/i,
  summary:/(professional summary|career objective|\bsummary\b|\bprofile\b|\bobjective\b|الملخص|نبذة|الهدف الوظيفي|ملخص مهني)/i,
  exp:/(experience|work history|employment|الخبرات|الخبرة|الخبرات العملية|الخبرة العملية)/i,
  edu:/(education|qualification|degree|التعليم|المؤهل|المؤهلات|الدراسة)/i,
  skills:/(\bskills\b|competencies|المهارات|الكفاءات)/i
};
const VERBS=['managed','led','developed','improved','reduced','increased','created','implemented','prepared','analyzed','designed','coordinated','delivered','achieved','built','optimized','reconciled','audited','trained','launched',
 'أدرت','قدت','طورت','حسنت','حسّنت','خفضت','خفّضت','زدت','أنشأت','نفذت','نفّذت','أعددت','حللت','صممت','نسقت','نسّقت','حققت','بنيت','راجعت','دربت','دعمت','أشرفت'];
const STOP=new Set(('the and for with you your our are will this that have from has not but all can any who job role work team years year experience ability strong must should able such their they them his her its also more than into over per out use using used including other etc about which what when where while within across '+
 'على في من الى إلى عن مع هذا هذه ذلك التي الذي التى الذى كما أو او ان أن كان يكون لدى لديه خلال بين عند حتى كل بعد قبل ذات وفق تكون يجب المطلوب مطلوب خبرة سنوات سنة').split(' '));

function words(s){return (s.toLowerCase().match(/[a-z0-9#+.]{2,}|[\u0600-\u06FF]{2,}/g)||[]);}

function analyze(cv){
  const w=words(cv).length;
  const verbHits=VERBS.filter(v=>cv.toLowerCase().includes(v)).length;
  const nums=(cv.match(/\d+\s?%|\d+[.,]?\d*\s?(k|m|million|مليون|ألف)?\b/gi)||[]).filter(x=>!/^(19|20)\d\d$/.test(x.trim())).length;
  const items=[
    {k:'email',pts:10,pass:RX.email.test(cv)},
    {k:'phone',pts:10,pass:RX.phone.test(cv)},
    {k:'link', pts:5, pass:RX.link.test(cv)},
    {k:'summary',pts:10,pass:RX.summary.test(cv)},
    {k:'exp',pts:15,pass:RX.exp.test(cv)},
    {k:'edu',pts:10,pass:RX.edu.test(cv)},
    {k:'skills',pts:10,pass:RX.skills.test(cv)},
    {k:'len',pts:10,pass:w>=250&&w<=800,arg:w,partial:(w>=150&&w<250)||(w>800&&w<=1000)},
    {k:'nums',pts:10,pass:nums>=3,arg:nums,partial:nums>=1&&nums<3},
    {k:'verbs',pts:10,pass:verbHits>=4,arg:verbHits,partial:verbHits>=2&&verbHits<4}
  ];
  let score=0;
  items.forEach(i=>{ i.got=i.pass?i.pts:(i.partial?Math.round(i.pts/2):0); score+=i.got; });
  return {score,items,words:w};
}

function matchJob(cv,jd){
  const cvSet=new Set(words(cv));
  const freq={};
  words(jd).forEach(x=>{ if(x.length>=3&&!STOP.has(x)&&!/^\d+$/.test(x)) freq[x]=(freq[x]||0)+1; });
  const kws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,25).map(e=>e[0]);
  const found=kws.filter(k=>cvSet.has(k)), missing=kws.filter(k=>!cvSet.has(k));
  return {pct:kws.length?Math.round(found.length/kws.length*100):0,found,missing};
}

function runReview(silent){
  const t=T[currentLang], err=document.getElementById('cvErr');
  const cvEl = document.getElementById('cvText');
  const jdEl = document.getElementById('jdText');
  const cv=cvEl ? cvEl.value.trim() : '';
  const jd=jdEl ? jdEl.value.trim() : '';
  
  if(!cv){ if(!silent && err) err.textContent=t.emptyErr; return; }
  if(words(cv).length<30){ if(err) err.textContent=t.shortErr; return; }
  if(err) err.textContent='';

  const r=analyze(cv);
  const color=r.score>=75?'var(--ok)':r.score>=50?'var(--warn)':'var(--bad)';
  const ring=document.getElementById('ring');
  if(ring){
    ring.style.setProperty('--c',color);
    ring.style.setProperty('--p',r.score);
  }
  const scoreNum = document.getElementById('scoreNum');
  if(scoreNum) scoreNum.textContent=r.score;
  const v=r.score>=75?t.v.great:r.score>=50?t.v.good:t.v.weak;
  const vTitle = document.getElementById('verdictTitle');
  const vText = document.getElementById('verdictText');
  if(vTitle) vTitle.textContent=v[0];
  if(vText) vText.textContent=v[1];

  const ul=document.getElementById('checksList');
  if(ul){
    ul.innerHTML='';
    const lines=[];
    r.items.forEach(i=>{
      const cls=i.pass?'ok':(i.partial?'warn':'bad');
      const okTxt=typeof t.ok[i.k]==='function'?t.ok[i.k](i.arg):t.ok[i.k];
      const fixTxt=typeof t.fix[i.k]==='function'?t.fix[i.k](i.arg):t.fix[i.k];
      const msg=i.pass?okTxt:fixTxt;
      const li=document.createElement('li'); li.className=cls;
      li.innerHTML=`<span>${i.pass?'✅':(i.partial?'⚠️':'❌')}</span><span><b>${esc(t.chk[i.k])}:</b> ${esc(msg)}</span><span class="pts">${i.got}/${i.pts}</span>`;
      ul.appendChild(li);
      lines.push(`${i.pass?'[OK]':(i.partial?'[~]':'[X]')} ${t.chk[i.k]} (${i.got}/${i.pts}): ${msg}`);
    });
  }

  let matchTxt='';
  const mp=document.getElementById('matchPanel');
  if(jd && mp){
    const m=matchJob(cv,jd);
    mp.style.display='block';
    const sumEl = document.getElementById('matchSummary');
    if(sumEl) sumEl.textContent=t.matchSummary(m.pct);
    const mk=document.getElementById('missingKw'), fk=document.getElementById('foundKw');
    if(mk) mk.innerHTML=m.missing.length?m.missing.map(k=>`<span class="miss">${esc(k)}</span>`).join(''):`<span class="hit">${t.noneMissing}</span>`;
    if(fk) fk.innerHTML=m.found.map(k=>`<span class="hit">${esc(k)}</span>`).join('');
    matchTxt=`\n${t.matchTitle}: ${m.pct}%\n${t.missingKw} ${m.missing.join(', ')}\n${t.foundKw} ${m.found.join(', ')}\n`;
  } else if(mp) { mp.style.display='none'; }

  lastReport=`Hire_Me - CV Report\n${'='.repeat(30)}\nScore: ${r.score}/100\n${v[0]}\n\n${matchTxt}`;
  const resEl = document.getElementById('result');
  if(resEl){
    resEl.style.display='block';
    if(!silent) resEl.scrollIntoView({behavior:'smooth'});
  }
}

function downloadReport(){
  const blob=new Blob(["\uFEFF"+lastReport],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='HireMe_CV_Report.txt';
  document.body.appendChild(a); a.click(); a.remove();

}
